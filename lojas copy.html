<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body {
  font-family:'Orbitron',sans-serif;
  background: url('http://172.16.2.7/DTI/img/1.png') no-repeat center center fixed;
  background-size: cover; /* Faz a imagem cobrir toda a tela */
  color: var(--accent);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 50px;
}

/* PARTICULAS DE FUNDO */
#particles-js {
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  z-index:-1;
}

/* TITULO PRINCIPAL */
h1 {
  margin-bottom:40px;
  color:#00ffff;
  font-size:3rem;
  font-weight:900;
  text-align:center;
  text-shadow:0 0 10px #00ffff,0 0 20px #00ffff,0 0 40px #00ffff;
  animation: glowPulse 2s infinite alternate;
}
@keyframes glowPulse {
  0% { text-shadow:0 0 10px #00ffff,0 0 20px #00ffff,0 0 40px #00ffff; }
  50% { text-shadow:0 0 20px #00ffff,0 0 40px #00ffff,0 0 60px #00ffff; }
  100% { text-shadow:0 0 30px #00ffff,0 0 60px #00ffff,0 0 80px #00ffff; }
}

/* INPUT DE PESQUISA */
#searchBox {
  width:100%;
  max-width:800px;  /* aumenta a largura máxima */
  padding:20px;     /* aumenta o tamanho interno */
  font-size:20px;   /* aumenta a fonte */
  margin-bottom:15px;
  width:100%;
  border-radius:15px;
  border:none;
  outline:none;
  text-align:center;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  color:#fff;
  box-shadow: inset 0 0 15px rgba(0,255,255,0.4),0 0 20px rgba(0,255,255,0.2);
  transition:0.3s;
}
#searchBox:focus { 
  transform:scale(1.03); 
  box-shadow: inset 0 0 25px rgba(0,255,255,0.6),0 0 35px rgba(0,255,255,0.4);
}

/* BADGE GLOBAL ULTRA HD */
#badgeGlobal {
  position: fixed;
  top: 3px;
  right: 10px;
  background: linear-gradient(135deg,#090a0a,#00bcd4);
  padding:4px 40px;
  border-radius:20px;
  color:#f1e9e9;
  font-weight:bold;
  text-align:center;
  z-index:1000;
  box-shadow:0 0 25px #00ffff,0 0 50px #00ffff;
}

#badgeGlobal h3 { font-size:14px; margin-bottom:5px; }
#badgeGlobal span { font-size:24px; font-weight:bold; }
#badgeGlobal div { font-size:12px; margin-top:5px; text-align:left; color:#fff; }
#badgeGlobal small { font-size:10px; color:#ccc; display:block; margin-top:3px; }




.regionais .regional-card {
  background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
  border-radius: 12px;
  box-shadow: 0 6px 15px rgba(0, 255, 255, 0.25), 0 0 10px rgba(0, 255, 255, 0.15) inset;
  color: #00ffff;
  padding: 10px;
  width: 100%;
  min-height: 90px; /* altura mais compacta */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  text-align: center;
}

.regionais .regional-card:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 10px 20px rgba(0, 255, 255, 0.4), 0 0 15px rgba(0, 255, 255, 0.2) inset;
}

.regionais .regional-card h3 {
  font-size: 1rem; /* título menor */
  margin-bottom: 5px;
}

.regionais .regional-card p {
  font-size: 0.8rem; /* texto menor */
  margin: 0;
}





/* CORES DIFERENTES PARA CADA REGIONAL */
.regional:nth-child(1) { background: linear-gradient(135deg,#1a2a6c,#b21f1f,#fdbb2d); }
.regional:nth-child(2) { background: linear-gradient(135deg,#283c86,#45a247); }
.regional:nth-child(3) { background: linear-gradient(135deg,#42275a,#734b6d); }
.regional:nth-child(4) { background: linear-gradient(135deg,#134e5e,#71b280); }
.regional:nth-child(5) { background: linear-gradient(135deg,#000428,#004e92,#fdbb2d); }
.regional:nth-child(6) { background: linear-gradient(135deg,#000428,#06b371); }
.regional:nth-child(7) { background: linear-gradient(135deg,#000428,#475581,#bd9131); }
.regional:nth-child(8) { background: linear-gradient(135deg,#000428,#06b371); }

/* RESULTADOS DA PESQUISA */
#resultadosPesquisa {
  width:100%;
  max-width:1100px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-bottom:20px;
}

.result-card {
  background: linear-gradient(135deg, rgba(0,255,255,0.1), rgba(0,0,0,0.2));
  border-radius: 20px;
  padding: 20px;
  width: 300px;
  box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff inset;
  transition: transform 0.3s, box-shadow 0.3s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.result-card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 40px #00ffff, 0 0 80px #00ffff inset;
}
.result-card h3 {
  font-size: 22px;
  color: #00ffff;
  font-weight: 900;
  text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(0,255,255,0.5);
  padding-bottom: 6px;
}
.result-card p {
  margin: 4px 0;
  font-size: 14px;
  color: #fff;
}
.result-card span {
  font-weight: bold;
  color: #00ffff;
}

/* CORES SUAVES ALTERNADAS POR LINHA */
.result-card:nth-child(4n+1) { background-color: rgba(255,182,193,0.2); }
.result-card:nth-child(4n+2) { background-color: rgba(173,216,230,0.2); }
.result-card:nth-child(4n+3) { background-color: rgba(216,191,216,0.2); }
.result-card:nth-child(4n+4) { background-color: rgba(255,255,224,0.2); }
.result-card:nth-child(4n+5) { background-color: rgba(255,255,224,0.2); }

.result-card:hover { transform: scale(1.05); box-shadow:0 0 15px #00ffff,0 0 30px #00ffff; }

/* TELA DE LOJAS */
#telaLojas {
  display:none;
  width:100%;
  max-width:100%; /* remove limitação */
  margin-top:20px;
  padding: 20px;
}


/* BOT O VOLTAR FLUTUANTE */
.btnVoltar {
  position: fixed;
  top: 20px;
  left: 270px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background: linear-gradient(135deg,#ff4757,#ff6b81);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  z-index: 1001;
  box-shadow:0 0 15px #ff4757,0 0 30px #ff6b81;
  transition:0.3s, transform 0.2s;
}
.btnVoltar:hover { 
  background: linear-gradient(135deg,#ff6b81,#ff4757);
  transform: scale(1.05);
  box-shadow:0 0 25px #ff6b81,0 0 50px #ff4757;
}

.filial-card {
  background: rgba(0,255,255,0.05);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  display:flex;
  flex-direction:column;
  gap:6px;
  box-shadow:0 0 10px #00ffff, inset 0 0 20px rgba(0,255,255,0.2);
}
.filial-card h3 { margin:0; color:#00ffff; font-size:18px; }
.filial-card .count-list { font-size:14px; font-weight:bold; line-height:1.4; }
.filial-card table { width:100%; border-collapse:collapse; margin-top:8px; }
.filial-card table td { padding:6px; border-bottom:1px solid rgba(255,255,255,0.2); font-size:13px; }
.filial-card table td.tipo-filial { color:#0b6fe0; font-weight:bold; }
.filial-card table td.tipo-posto { color:#feca57; font-weight:bold; }
.filial-card table td.tipo-representante { color:#f0e007; font-weight:bold; }
.filial-card table td.tipo-deposito { color:#48dbfb; font-weight:bold; }
</style>
</head>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lojas Claudino </title>

<!-- Estilos principais -->
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
body{background:#0d0d0d;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px;overflow-x:hidden;}

/* PARTICULAS DE FUNDO */
#particles-js{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}

/* TITULO PRINCIPAL */
h1{margin-bottom:40px;color:#00ffff;font-size:3rem;font-weight:900;text-align:center;text-shadow:0 0 10px #00ffff,0 0 20px #00ffff,0 0 40px #00ffff;animation:glowPulse 2s infinite alternate;}
@keyframes glowPulse{0%{text-shadow:0 0 10px #00ffff,0 0 20px #00ffff,0 0 40px #00ffff;}50%{text-shadow:0 0 20px #00ffff,0 0 40px #00ffff,0 0 60px #00ffff;}100%{text-shadow:0 0 30px #00ffff,0 0 60px #00ffff,0 0 80px #00ffff;}}

/* INPUT DE PESQUISA */
#searchBox{margin-bottom:15px;width:100%;max-width:550px;padding:15px;border-radius:15px;border:none;outline:none;font-size:18px;text-align:center;background:rgba(255,255,255,0.05);backdrop-filter:blur(12px);color:#fff;box-shadow:inset 0 0 15px rgba(0,255,255,0.4),0 0 20px rgba(0,255,255,0.2);transition:0.3s;}
#searchBox:focus{transform:scale(1.03);box-shadow:inset 0 0 25px rgba(0,255,255,0.6),0 0 35px rgba(0,255,255,0.4);}

/* BADGE GLOBAL */
#badgeGlobal{position:fixed;top:3px;right:10px;background:linear-gradient(135deg,#111111,#00bcd4);padding:15px 20px;border-radius:20px;color:#f1e9e9;font-weight:bold;text-align:center;z-index:1000;box-shadow:0 0 25px #00ffff,0 0 50px #00ffff;}
#badgeGlobal h3{font-size:14px;margin-bottom:5px;} #badgeGlobal span{font-size:24px;font-weight:bold;} #badgeGlobal small{font-size:10px;color:#ccc;display:block;margin-top:3px;}

/* Tipos */
.tipo-filial{color:#0b6fe0;font-weight:bold;}
.tipo-posto{color:#feca57;font-weight:bold;}
.tipo-representante{color:#f0e007;font-weight:bold;}
.tipo-deposito{color:#48dbfb;font-weight:bold;}

/* Regionais */
.regionais{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:25px;width:100%;max-width:1300px;margin-top:20px;}
.regional{padding:25px;border-radius:20px;text-align:center;cursor:pointer;position:relative;color:#fff;transition:transform 0.5s ease,box-shadow 0.5s ease;box-shadow:0 10px 25px rgba(0,255,255,0.5), inset 0 0 20px rgba(0,255,255,0.2);}
.regional:hover{transform: scale(1.08) perspective(500px) rotateX(3deg) rotateY(3deg);box-shadow:0 15px 35px rgba(0,255,255,0.7), inset 0 0 30px rgba(0,255,255,0.4);}
.regional h2{font-size:24px;font-weight:900;color:#00ffff;text-shadow:0 0 10px #00ffff,0 0 20px #00ffff;}
.badge-total{position:absolute;top:70px;right:15px;background:#f5f2f2;color:#000;padding:10px 16px;font-weight:bold;font-size:20px;border-radius:8px;box-shadow:0 0 15px #00ffff,0 0 30px #00ffff;}

/* Tela de Lojas */
#telaLojas{
  display:none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  max-width: 100%;
  padding: 80px 30px 30px 260px; /* espaço pro painel lateral */
  overflow-y: auto;
  background: rgba(0,0,0,0.95);
  backdrop-filter: blur(10px);
  z-index: 999;
}


.btnVoltar{
  position: fixed;
  top: 4px;
  left: 150px;
  z-index: 1001;

  padding: 16px 26px;
  border-radius: 30px;
  border: 2px solid transparent;

  background: linear-gradient(135deg, #252121, #222021);
  color: #fff;
  font-weight: bold;
  font-size: 14px;
  letter-spacing: 1px;

  cursor: pointer;

  box-shadow:
    0 0 10px #ff4757,
    0 0 20px #ff6b81,
    inset 0 0 10px rgba(255,255,255,0.2);

  transition: all 0.3s ease;
}

/* Ícone opcional */
.btnVoltar::before{
  content: " ";
  font-size: 16px;
}

/* Hover animado */
.btnVoltar:hover{
  background: linear-gradient(135deg, #ff6b81, #ff4757);
  transform: scale(1.08);

  box-shadow:
    0 0 20px #ff6b81,
    0 0 40px #ff4757,
    inset 0 0 15px rgba(255,255,255,0.3);
}

/* Clique (efeito pressão) */
.btnVoltar:active{
  transform: scale(0.95);
  box-shadow:
    0 0 10px #ff4757 inset,
    0 0 20px #ff6b81 inset;
}

/* Glow animado contínuo */
@keyframes glowBtn {
  0% { box-shadow: 0 0 10px #ff4757, 0 0 20px #ff6b81; }
  50% { box-shadow: 0 0 20px #ff6b81, 0 0 40px #ff4757; }
  100% { box-shadow: 0 0 10px #ff4757, 0 0 20px #ff6b81; }
}

.btnVoltar{
  animation: glowBtn 2s infinite alternate;
}

  background: rgba(0,255,255,0.05);
  border-radius:15px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
  box-shadow:0 0 15px #00ffff, inset 0 0 25px rgba(0,255,255,0.2);
  transition: 0.3s;
}

.filial-card table td.tipo-posto{color:#feca57;font-weight:bold;}

/* Resultado filtro lateral */

#resultadoFiltro {

/* BOTÃO PARA VOLTAR MENU PRINCIPAL */

  position: fixed;

/* Texto */
.cnpj-text {
  color: #fff;
  font-weight: bold;
}

/* Ícone escondido */
.copy-icon {
  opacity: 0;
  transform: translateX(-5px);
  font-size: 12px;

  transition: 0.2s;
}

/* Quando passar o mouse */
.cnpj-box:hover {
  box-shadow: 0 0 15px #00ffff;
}

.cnpj-box:hover .copy-icon {
  opacity: 1;
  transform: translateX(0);
}

/* Hover geral */
.cnpj-box:hover .cnpj-text {
  color: #00ffff;
}

/* Mini cards */
.result-card {
  background: rgba(0,0,0,0.8);
  border: 2px solid #00ffff;
  border-radius: 10px;
  padding: 8px;
  font-family: 'Segoe UI', sans-serif;
  color: #fff;
  font-size: 11px;
  box-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff inset;
  transition: transform 0.2s, box-shadow 0.2s;
  text-align: left;
}

.result-card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px #00ffff, 0 0 20px #00ffff inset;
}

.result-card h4 {
  color: #0ff;
  font-weight: 900;
  font-size: 13px;
  margin-bottom: 3px;
  border-bottom: 1px solid rgba(0,255,255,0.5);
  padding-bottom: 2px;
}

.result-card p {
  margin: 1px 0;
}
.result-card span {
  font-weight: bold;
  color: #0ff;
}


.siglaFilial {
  color: #ff1a1a;             /* vermelho neon */
  font-weight: 900;
  font-size: 14px;
  text-shadow: 0 0 5px #161515, 0 0 10px #ff1a1a;
  background: rgba(255,0,0,0.1);
  padding: 2px 6px;
  border-radius: 6px;
  margin-right: 6px;
}


.siglaBadge {
  display: inline-block;
  background-color: #ff4d4d;  /* cor de destaque */
  color: white;
  font-weight: bold;
  font-size: 15px;           /* bem pequeno */
  padding: 3px 8px;          /* tamanho do quadrado */
  border-radius: 8px;        /* cantos arredondados */
  text-align: center;
  margin-left: 5px;
}

.cnpj{
  color: #fff;
  font-weight: 900;
  background: linear-gradient(135deg,#000,#1a1a1a);
  padding: 4px 10px;
  border-radius: 10px;
  box-shadow: 0 0 10px #ffffff;
  display: inline-block;
  letter-spacing: 1px;
}

.grid-badges {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px; /* quase colado */
  margin-top: 5px;
}

/* TOTAL ocupa toda linha */
.grid-badges .destaque {
  grid-column: 1 / -1;
}

.box {
  background: rgba(0,0,0,0.7);
  border-radius: 6px;
  padding: 4px 2px;
  
  display: flex;
  flex-direction: column;
  justify-content: center;  /* centraliza vertical */
  align-items: center;      /* centraliza horizontal */

  text-align: center;
  box-shadow: 0 0 4px #00ffff;
  line-height: 1.1;
}

/* número */
.box span {
  display: block;
  font-size: 12px; /* bem pequeno */
  font-weight: bold;
}

/* texto */
.box small {
  font-size: 9px;
  color: #aaa;
}

/* cores bem sutis */
.box.total { border: 1px solid #00ffff; }
.box.filial { border: 1px solid #0b6fe0; }
.box.posto { border: 1px solid #feca57; }
.box.deposito { border: 1px solid #48dbfb; }
.box.representante { border: 1px solid #f0e007; }

/* hover quase imperceptível */
.box:hover {
  transform: scale(1.02);
}

/* PAINEL LATERAL FILTRO */

.alerta-vazio {
  background: rgba(0, 0, 0, 0.8);
  border: 1px solid #ff4757;
  border-radius: 15px;
  padding: 15px 10px;
  text-align: center;
  box-shadow:
    0 0 10px #ff4757,
    0 0 25px rgba(255,71,87,0.5),
    inset 0 0 10px rgba(255,71,87,0.3);
  animation: fadeIn 0.3s ease;
}

.alerta-icon {
  font-size: 20px;
  margin-bottom: 5px;
  animation: pulseIcon 1.5s infinite;
}

.alerta-vazio h3 {
  color: #ff6b81;
  font-size: 14px;
  margin-bottom: 6px;
  text-shadow: 0 0 6px #ff4757;
}

.alerta-vazio p {
  font-size: 11px;
  color: #ccc;
  margin-bottom: 6px;
}

/* DICAS */
.dicas {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
}

.dicas span {
  font-size: 9px;
  padding: 3px 6px;
  border-radius: 6px;
  background: rgba(255,71,87,0.1);
  border: 1px solid #ff4757;
  color: #fff;
  box-shadow: 0 0 5px #ff4757;
}

/* animações */
@keyframes pulseIcon {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

#filtroLateral {
  position: fixed;
  top: 16%;           /* centraliza verticalmente */
  left: 0;
  height: 35vh;       /* altura menor */
  width: 220px;       /* largura menor */
  transform: translateY(-50%);
  background: rgba(0, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border-radius: 0 10px 10px 0;
  padding: 10px;      /* padding menor */
  box-shadow: 2px 0 12px #00ffff, 2px 0 20px #00ffff;
  color: #fff;
  font-weight: bold;
  display: flex;
  flex-direction: column;
  gap: 6px;           /* menor espaço entre os elementos */
  z-index: 999;
}

#filtroLateral select,
#btnExportFiltro,
#btnLimparFiltro {
  padding: 4px 6px;   /* reduz o padding interno dos inputs e botões */

.badgeFiltro {

  font-size:13px;
  font-weight:bold;
  color:#ffd700;

  border:1px solid rgba(255,215,0,0.6);
  box-shadow:0 0 8px rgba(255,215,0,0.4);
  transition:0.3s;
  cursor:default;
}

  box-shadow:0 0 15px #ffd700,0 0 30px rgba(255,215,0,0.6);
  background:rgba(255,215,0,0.15);
}

}

}

.busca-termo {
  animation: pulseBusca 1.5s infinite alternate;
}

@keyframes pulseBusca {
  from { transform: scale(1); }
  to { transform: scale(1.05); }
}

.alerta-vazio {

    0 0 15px #ff4757,
    0 0 40px rgba(255,71,87,0.4),
    inset 0 0 15px rgba(255,71,87,0.2);
  animation: fadeIn 0.4s ease;
  overflow: hidden;
}

/* linha topo animada */
.alerta-topo {
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, transparent, #ff4757, transparent);
  animation: slideTop 2s infinite;
}

/* ícone */
.alerta-icon {
  font-size: 22px;
  margin-bottom: 6px;
  animation: pulseIcon 1.5s infinite;
}

/* título */

  font-size: 15px;
  margin-bottom: 5px;
  text-shadow: 0 0 8px #ff4757;
}

/* descrição */

/* BOTÃO */

  box-shadow: 0 0 10px #ff4757, 0 0 20px rgba(255,71,87,0.5);
  transition: all 0.3s ease;
}

  box-shadow: 0 0 20px #ff6b81, 0 0 40px rgba(255,71,87,0.8);
}

/* clique */
.btn-limpar:active {
  transform: scale(0.95);
}

/* animações */
@keyframes pulseIcon {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

@keyframes slideTop {
  0% { left: -100%; }
  100% { left: 100%; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }

}

.btn-copiar:hover {

  transition: 0.2s;
}

.cnpj:hover {

  text-shadow: 0 0 6px #00ffff;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #00ffff;
  color: #000;
  padding: 10px 15px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
  box-shadow: 0 0 15px #00ffff;

  opacity: 0;
  transform: translateY(20px);
  transition: 0.3s;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

function copiarCNPJ(cnpj) {
  if (!cnpj || cnpj === "Nao Informado") return;

  const input = document.createElement("input");
  input.value = cnpj;
  document.body.appendChild(input);

  input.select();
  document.execCommand("copy");

  document.body.removeChild(input);

  alert("CNPJ copiado!");
}

function mostrarToast(msg) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerText = msg;

  document.body.appendChild(toast);

  setTimeout(() => toast.classList.add("show"), 50);

  setTimeout(() => toast.remove(), 2000);
}



function copiarFallback(texto, el) {
  const input = document.createElement("textarea");
  input.value = texto;
  document.body.appendChild(input);
  input.select();
  input.setSelectionRange(0, 99999);

  try {
    document.execCommand("copy");
    feedbackCopia(el, texto);
  } catch (err) {
    alert("Não foi possível copiar o CNPJ");
  }

  document.body.removeChild(input);
}

function sugerirLojas(termo) {
  let sugestoes = [];

  for (let reg in regionais) {
    regionais[reg].forEach(l => {
      const texto = `${l.sigla} ${l.cidade} ${l.filial}`.toLowerCase();

      // pega coisas parecidas (contém parte do termo)
      if (texto.includes(termo.slice(0, 2))) {
        sugestoes.push({
          nome: `${l.sigla} - ${l.cidade}`,
          valor: l.sigla
        });
      }
    });
  }

  // remove duplicados e limita
  return [...new Map(sugestoes.map(s => [s.nome, s])).values()].slice(0, 5);
}


// --- Exporta  o Excel ---
function exportarFiltroExcel(){
  if(filtroLateralDados.length===0){alert("Nenhum dado para exportar.");return;}
  const wb=XLSX.utils.book_new();const ws_data=[];
  const dadosPorRegional={};
  filtroLateralDados.forEach(l=>{if(!dadosPorRegional[l.regional]) dadosPorRegional[l.regional]=[];dadosPorRegional[l.regional].push(l);});
  for(const reg in dadosPorRegional){
    const lojas=dadosPorRegional[reg];
    ws_data.push([`${reg}`],["Filial","Sigla","CNPJ","Cidade","UF","Tipo"]);
    lojas.forEach(l=>ws_data.push([l.filial,l.sigla,l.cnpj,l.cidade,l.uf,l.tipo]));
    ws_data.push([]);
  }
  const ws=XLSX.utils.aoa_to_sheet(ws_data);
  ws['!cols']=[{wch:25},{wch:10},{wch:20},{wch:5},{wch:15}];
  XLSX.utils.book_append_sheet(wb,ws,"Lojas Filtradas");XLSX.writeFile(wb,"lojas_filtradas.xlsx");
}
