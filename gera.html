<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #2c2c44;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
      width: 350px;
    }
    h1 {
      margin-bottom: 20px;
      color: #00ffcc;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input[type="number"] {
      width: 60px;
      padding: 5px;
      border-radius: 5px;
      border: none;
      text-align: center;
    }
    input[type="checkbox"] {
      margin-right: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #00ffcc;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #00d1a6;
    }
    #senha {
      margin-top: 20px;
      padding: 10px;
      background: #1e1e2f;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gerador de Senhas</h1>

    <label for="tamanho">Tamanho da senha:</label>
    <input type="number" id="tamanho" value="12" min="4" max="64">

    <label>
      <input type="checkbox" id="maiusculas" checked> Letras Maiúsculas
    </label>
    <label>
      <input type="checkbox" id="minusculas" checked> Letras Minúsculas
    </label>
    <label>
      <input type="checkbox" id="numeros" checked> Números
    </label>
    <label>
      <input type="checkbox" id="simbolos" checked> Símbolos
    </label>

    <button onclick="gerarSenha()">Gerar Senha</button>

    <div id="senha"></div>
  </div>

  <script>
    function gerarSenha() {
      const tamanho = parseInt(document.getElementById("tamanho").value);
      const usarMaiusculas = document.getElementById("maiusculas").checked;
      const usarMinusculas = document.getElementById("minusculas").checked;
      const usarNumeros = document.getElementById("numeros").checked;
      const usarSimbolos = document.getElementById("simbolos").checked;

      let caracteres = "";
      if (usarMaiusculas) caracteres += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      if (usarMinusculas) caracteres += "abcdefghijklmnopqrstuvwxyz";
      if (usarNumeros) caracteres += "0123456789";
      if (usarSimbolos) caracteres += "!@#$%^&*()_+-=[]{}|;:,.<>?";

      if (caracteres === "") {
        alert("Selecione pelo menos um tipo de caractere!");
        return;
      }

      let senha = "";
      for (let i = 0; i < tamanho; i++) {
        senha += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
      }

      document.getElementById("senha").textContent = senha;
    }
  </script>
</body>
</html>
