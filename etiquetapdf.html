<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Dashboard TI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top,#0f172a,#020617);
    color:#fff;
    padding:20px;
}

/* CONTAINER */
.container{
    max-width:1200px;
    margin:auto;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h1{
    font-size:24px;
}

.counter{
    background:#38bdf8;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    color:#000;
    box-shadow:0 0 15px rgba(56,189,248,0.6);
}

/* UPLOAD BOX */
.upload-box{
    border:2px dashed #38bdf8;
    padding:40px;
    text-align:center;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
    background:rgba(255,255,255,0.02);
}

.upload-box:hover{
    background:rgba(56,189,248,0.1);
    transform:scale(1.02);
}

input{
    display:none;
}

/* GRID */
.preview{
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(auto-fill, 200px);
    gap:20px;
    justify-content:flex-start;
    align-content:flex-start;
}

/* CARD */
.card{
    background:linear-gradient(145deg,#1e293b,#0f172a);
    border-radius:12px;
    padding:10px;
    box-shadow:0 10px 20px rgba(0,0,0,0.6);
    transition:0.3s;
    transform-style:preserve-3d;
    position:relative;
}

.card:hover{
    transform:rotateY(8deg) rotateX(5deg) scale(1.05);
    box-shadow:0 20px 30px rgba(0,0,0,0.8);
}

/* PREVIEW */
.card img{
    width:100%;
    border-radius:8px;
}

.card iframe{
    width:100%;
    height:150px;
    border:none;
    border-radius:8px;
}

/* NOME */
.nome{
    font-size:12px;
    margin-top:6px;
    opacity:0.8;
}

/* BOTÃO */
.btn{
    margin-top:8px;
    width:100%;
    padding:6px;
    border:none;
    background:#ef4444;
    color:#fff;
    border-radius:6px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#dc2626;
}

/* ANIMAÇÃO ENTRADA */
.card{
    animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📁 Dashboard de Arquivos</h1>
        <div class="counter" id="contador">0 Arquivos</div>
    </div>

    <label class="upload-box">
        🚀 Clique ou arraste arquivos aqui
        <input type="file" id="fileInput" multiple accept="application/pdf,image/jpeg,image/png">
    </label>

    <div class="preview" id="preview"></div>

</div>

<script>
const input = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const contador = document.getElementById("contador");

let arquivos = JSON.parse(localStorage.getItem("arquivos")) || [];

function salvar(){
    localStorage.setItem("arquivos", JSON.stringify(arquivos));
}

function atualizarContador(){
    contador.textContent = arquivos.length + " Arquivo(s)";
}

function render(){
    preview.innerHTML = "";

    arquivos.forEach((arquivo, index)=>{
        const div = document.createElement("div");
        div.className = "card";

        let conteudo = "";

        if(arquivo.tipo.includes("image")){
            conteudo = `<img src="${arquivo.base64}">`;
        } else if(arquivo.tipo.includes("pdf")){
            conteudo = `<iframe src="${arquivo.base64}"></iframe>`;
        }

        div.innerHTML = `
            ${conteudo}
            <div class="nome">${arquivo.nome}</div>
            <button class="btn" onclick="remover(${index})">Excluir</button>
        `;

        preview.appendChild(div);
    });

    atualizarContador();
}

function remover(index){
    arquivos.splice(index,1);
    salvar();
    render();
}

input.addEventListener("change", (e)=>{
    const files = e.target.files;

    for(let file of files){

        if(file.size > 2 * 1024 * 1024){
            alert("Arquivo muito grande! Máx: 2MB");
            continue;
        }

        const reader = new FileReader();

        reader.onload = function(event){
            arquivos.push({
                nome: file.name,
                tipo: file.type,
                base64: event.target.result
            });

            salvar();
            render();
        }

        reader.readAsDataURL(file);
    }

    input.value = "";
});

render();
</script>

</body>
</html>
