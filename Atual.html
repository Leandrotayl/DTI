.consulta-alert{
  position:relative;
  margin:25px 0 35px;
  padding:20px 28px;
  border-radius:14px;

  font-size:16px;
  font-weight:700;
  color:#ffffff;

  background:rgba(20,20,20,0.8);
}

/* Vertical */
.consulta-alert::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:14px;
  padding:2px;
  background:
    linear-gradient(#00ffc8,#00ffc8) left,
    linear-gradient(#00ffc8,#00ffc8) right,
    linear-gradient(#ffcc00,#ffcc00) top,
    linear-gradient(#ffcc00,#ffcc00) bottom;

  background-size:
    2px 100%,
    2px 100%,
    100% 2px,
    100% 2px;

  background-repeat:no-repeat;
  pointer-events:none;
}

.cidadeResumo{
  position:relative;
  display:inline-block;
  margin-top:8px;
  padding:10px 20px;

  font-size:0.80em;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;

  color:#7CFFB2;

  text-shadow:
    0 0 6px rgba(124,255,178,0.6),
    0 0 18px rgba(124,255,178,0.3);

  animation:fadeCidade 0.5s ease forwards;
}

/* Moldura animada */
.cidadeResumo::before{
  content:"";
  position:absolute;
  inset:0;
  border:2px solid transparent;
  border-radius:6px;

  background:
    linear-gradient(#00ff88,#00ff88) top left,
    linear-gradient(#00ff88,#00ff88) top right,
    linear-gradient(#00ff88,#00ff88) bottom right,
    linear-gradient(#00ff88,#00ff88) bottom left;

  background-size:0% 2px, 2px 0%, 0% 2px, 2px 0%;
  background-repeat:no-repeat;

  animation:fecharQuadro 0.8s ease forwards;
}

/* Animação fechando o quadro */
@keyframes fecharQuadro{
  0%{
    background-size:
      0% 2px,
      2px 0%,
      0% 2px,
      2px 0%;
  }
  25%{
    background-size:
      100% 2px,
      2px 0%,
      0% 2px,
      2px 0%;
  }
  50%{
    background-size:
      100% 2px,
      2px 100%,
      0% 2px,
      2px 0%;
  }
  75%{
    background-size:
      100% 2px,
      2px 100%,
      100% 2px,
      2px 0%;
  }
  100%{
    background-size:
      100% 2px,
      2px 100%,
      100% 2px,
      2px 100%;
  }
}

@keyframes fadeCidade{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card-loja-pesquisada {
  position: relative;
  background: linear-gradient(145deg, #2a2a2a, #1a1a1a);

}

/* brilho interno sutil */
.card-loja-pesquisada::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.08) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0.6s ease;
}

.card-loja-pesquisada:hover::after {
  transform: translateX(100%);
}

}

/* Mostrar */
.copy-msg.show {
  right: 30px;
  transform: scale(1);
  opacity: 1;
}

function baixarResultado() {
  if (resultadoAtual.length === 0) return;

    csv += `${loja.sigla},${loja.filial},${loja.tipo},${loja.ip},${loja.dispositivo}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

  const link = document.createElement("a");
  link.href = url;
  link.download = "resultado_filtro_claudino.csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

function baixarExcel() {
  if (resultadoAtual.length === 0) return;

  const ws_data = [

  ];

  resultadoAtual.forEach(loja => {
    ws_data.push([
      loja.sigla,

      loja.tipo,
      loja.ip,
      loja.dispositivo,
      loja.cidade,
      loja.pdvs.join(", ")

  `;

  return;
}


  mostrarTabela(resultado);
}



function atualizarResumo(lista = lojas){

  const totalGeral = lista.length;
  const totalFilial = lista.filter(l => l.tipo.toLowerCase() === "filial").length;
  const totalPostos = lista.filter(l => l.tipo.toLowerCase() === "posto").length;
  const totalDeposito = lista.filter(l => l.tipo.toLowerCase() === "deposito").length;
  const totalRep = lista.filter(l => l.tipo.toLowerCase() === "representante").length;

  const totalForti = lista.filter(l => l.dispositivo.toLowerCase() === "fortigate").length;
  const totalMikrotik = lista.filter(l => l.dispositivo.toLowerCase() === "mikrotik").length;

  document.getElementById("totalGeral").textContent = totalGeral;
  document.getElementById("totalFilial").textContent = totalFilial;
  document.getElementById("totalPostos").textContent = totalPostos;
  document.getElementById("totalDeposito").textContent = totalDeposito;
  document.getElementById("totalRep").textContent = totalRep;

  document.getElementById("totalForti").textContent = totalForti;
  document.getElementById("totalMikrotik").textContent = totalMikrotik;
  
}

function mostrarBotaoCarregos(sigla){

  removerBotaoCarregos(); // evita duplicar botão

  const btn = document.createElement("button");
  btn.id = "btnCarregos";
  btn.textContent = "VER CARREGOS";
  btn.style.marginTop = "10px";
  btn.style.padding = "6px 12px";
  btn.style.borderRadius = "8px";
  btn.style.border = "none";
  btn.style.cursor = "pointer";
  btn.style.fontWeight = "700";
  btn.style.background = "linear-gradient(135deg,#ffcc00,#ffd700)";
  btn.style.color = "#000";
  btn.style.boxShadow = "0 0 10px #ffcc00";
  btn.style.transition = "0.2s";

  btn.onmouseenter = () => {
    btn.style.transform = "scale(1.05)";
  };

  btn.onmouseleave = () => {
    btn.style.transform = "scale(1)";
  };

  btn.onclick = () => abrirModalCarregos(sigla);

  document.querySelector(".card-loja-pesquisada").appendChild(btn);
}

function removerBotaoCarregos(){
  const antigo = document.getElementById("btnCarregos");
  if(antigo) antigo.remove();
}
