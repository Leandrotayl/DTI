

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Carrego</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#00f5ff;
  --accent:#22ff88;
  --glass:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.15);
}

*{box-sizing:border-box;margin:0;padding:0}

 body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 20px;

  /* ?? Imagem no fundo */
  background: 
  linear-gradient(135deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55)),
  url("SUA-IMAGEM.jpg"),
url('http://172.16.2.7/DTI/img/1.png');  /* coloque aqui o nome da sua imagem */

  background-size: cover;          /* preenche a tela inteira */
  background-position: center;     /* centraliza */
  background-repeat: no-repeat;    /* evita repetição */
  background-attachment: fixed;    /* efeito de paralaxe (opcional) */

  color: #fff;
  animation: bgGradient 15s ease infinite; /* mantém sua animação */
}


/* HEADER */
header{
  padding:2px 2px 2px;
  text-align:center;
}

.titulo{
  font-size:34px;
  font-weight:800;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.data{
  margin-top:8px;
  opacity:0.8;
}

.container{
  max-width:1200px;
  margin:10px auto 30px auto;
  padding:10px;
}

/* BUSCA PREMIUM */
.search-box{
  display:flex;
  justify-content:center;
  margin-top:0;
  margin-bottom:35px;
  position:relative;
}

.search-box input{
  width:100%;
  max-width:480px;
  padding:16px 25px;
  border-radius:60px;
  border:1px solid rgba(255,255,255,0.15);
  background:linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  backdrop-filter:blur(25px);
  color:#ffffff;
  font-size:16px;
  text-align:center;
  outline:none;
  transition:0.3s ease-in-out;
  box-shadow:0 0 15px rgba(0,255,136,0.15);
}

/* Efeito ao focar */
.search-box input:focus{
  border:1px solid #00ff88;
  box-shadow:0 0 20px rgba(0,255,136,0.6);
  transform:scale(1.03);
}

/* Placeholder elegante */
.search-box input::placeholder{
  color:rgba(255,255,255,0.5);
  letter-spacing:1px;
}

/* BOTÃO PARA VOLTAR MENU PRINCIPAL */
/* Botão MENU PRINCIPAL reposicionado no topo da lateral */
#btnMenu {
  position: fixed;
  top: 10px;       /* distancia do topo */
  left: 348px;      /* fixa na lateral esquerda */
  width: 240px;    /* largura consistente com o painel lateral */
  padding: 15px 0;
  background: linear-gradient(135deg,#0d47a1,#1976d2);
  color: #0ff;
  border: 3px solid #ff0000;
  border-radius: 15px;
  font-size: 1rem;
  font-weight: bold;
  text-align: center;
  cursor: pointer;
  text-shadow: 0 0 5px #ff0000, 0 0 15px #ff0000;
  box-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000 inset;
  transition: all 0.3s ease-in-out;
  z-index: 1001;   /* acima do painel lateral */
}

#btnMenu:hover {
  background: linear-gradient(145deg,#ff0000,#1a1aff);
  color: #fff;
  box-shadow: 0 0 25px #ff4d4d, 0 0 50px #ff4d4d inset;
  transform: scale(1.05);
}


/* GRID DIA */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:30px;
}

.card{
  position:relative;
  border-radius:28px;
  padding:35px;
  overflow:hidden;
  transition:0.4s ease;
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);
  background:linear-gradient(145deg,
    rgba(255,255,255,0.08),
    rgba(255,255,255,0.02)
  );
  box-shadow:
    0 25px 70px rgba(0,0,0,0.75),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

/* Hover robusto */
.card:hover{
  transform:translateY(-12px) scale(1.03);
  box-shadow:
    0 35px 90px rgba(0,0,0,0.9),
    0 0 40px rgba(0,255,255,0.25);
}


/* =========================
   FILIAIS (AZUL)
========================= */
.card-filiais::before,
.card-filiais::after{
  content:"";
  position:absolute;
  left:0;
  width:100%;
  height:6px;
  background:linear-gradient(90deg,#00f5ff,#00c3ff);
  box-shadow:0 0 15px rgba(0,245,255,0.6);
}

.card-filiais::before{ top:0; }
.card-filiais::after{ bottom:0; }

/* =========================
   POSTOS (VERDE)
========================= */
.card-postos::before,
.card-postos::after{
  content:"";
  position:absolute;
  left:0;
  width:100%;
  height:6px;
  background:linear-gradient(90deg,#22ff88,#00cc66);
  box-shadow:0 0 15px rgba(34,255,136,0.6);
}

.card-postos::before{ top:0; }
.card-postos::after{ bottom:0; }

/* =========================
   LOJAS (AMARELO)
========================= */
.card-lojas::before,
.card-lojas::after{
  content:"";
  position:absolute;
  left:0;
  width:100%;
  height:6px;
  background:linear-gradient(90deg,#ffcc00,#ffaa00);
  box-shadow:0 0 15px rgba(255,204,0,0.6);
}

.card-lojas::before{ top:0; }
.card-lojas::after{ bottom:0; }
.card::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(0,245,255,0.08),
    transparent
  );
  transform:rotate(25deg);
  animation:cardShine 6s linear infinite;
}

.card:hover{
  transform:translateY(-10px) scale(1.02);
  border:1px solid var(--primary);
  box-shadow:0 20px 60px rgba(0,0,0,0.6),
             0 0 30px rgba(0,245,255,0.15);
}

@keyframes cardShine{
  0%{transform:translateX(-100%) rotate(25deg);}
  100%{transform:translateX(100%) rotate(25deg);}
}

/* FILIAIS */
.card-filiais{
  border:3px solid #00f5ff;
  box-shadow:
    0 0 15px rgba(0,245,255,0.6),
    0 0 40px rgba(0,245,255,0.3),
    0 20px 60px rgba(0,0,0,0.8);
}

/* POSTOS */
.card-postos{
  border:3px solid #22ff88;
  box-shadow:
    0 0 15px rgba(34,255,136,0.6),
    0 0 40px rgba(34,255,136,0.3),
    0 20px 60px rgba(0,0,0,0.8);
}

/* LOJAS TERESINA */
.card-lojas{
  border:3px solid #ffcc00;
  box-shadow:
    0 0 15px rgba(255,204,0,0.6),
    0 0 40px rgba(255,204,0,0.3),
    0 20px 60px rgba(0,0,0,0.8);
}

/* CABEÇALHO DO CARD */
.card h3{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  margin-bottom:25px;
  padding-bottom:12px;
  border-bottom:1px solid rgba(241, 238, 14, 0.1);
  letter-spacing:1px;
}

.lojas-carrego-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
  gap:8px;
}

/* BADGE MAIS ROBUSTO */
.badge{
  padding:8px 16px;
  border-radius:25px;
  font-weight:800;
  font-size:15px;
  letter-spacing:1px;
  background:linear-gradient(135deg,#f1f50c,#d4faff);
  color:#000;
  box-shadow:
    0 6px 15px rgba(0,0,0,0.4),
    inset 0 2px 4px rgba(255,255,255,0.6);
}

.loja{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin:6px;
  padding:10px 18px;
  min-width:65px;
  height:45px;

  font-weight:800;
  font-size:15px;
  letter-spacing:1px;

  border-radius:14px;
  border:1px solid rgba(255,255,255,0.2);

  background:linear-gradient(180deg,#1e293b,#0f172a);
  color:#00f5ff;

  box-shadow:
    0 6px 15px rgba(0,0,0,0.6),
    inset 0 2px 4px rgba(255,255,255,0.1);

  transition:0.3s ease;
}

.loja:hover{
  transform:translateY(-4px) scale(1.08);
  background:linear-gradient(180deg,#00f5ff,#22ff88);
  color:#020617;
  box-shadow:
    0 10px 25px rgba(0,255,255,0.5);
}

.nao-encontrado{
  position:relative;
  padding:30px 25px;
  border-radius:25px;
  text-align:center;
  overflow:hidden;

  background:linear-gradient(145deg,
    rgba(255,0,0,0.08),
    rgba(255,0,0,0.02)
  );

  border:1px solid rgba(255,0,0,0.5);

  box-shadow:
    0 15px 40px rgba(0,0,0,0.7),
    0 0 25px rgba(255,0,0,0.2);

  animation:fadeInScale 0.4s ease;
}

/* brilho animado */
.nao-encontrado::before{
  content:"";
  position:absolute;
  top:-40%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.08),
    transparent
  );
  transform:rotate(25deg);
  animation:shine 3s infinite linear;
}

.nao-encontrado .icone{
  font-size:45px;
  margin-bottom:12px;
  animation:pulseIcon 1.5s infinite ease-in-out;
}

.nao-encontrado .titulo-erro{
  font-size:20px;
  font-weight:800;
  color:#ff4d4d;
  margin-bottom:8px;
  letter-spacing:1px;
}

.nao-encontrado .subtexto{
  font-size:14px;
  opacity:0.75;
}

/* anima  es */
@keyframes fadeInScale{
  from{opacity:0; transform:scale(0.9);}
  to{opacity:1; transform:scale(1);}
}

@keyframes shine{
  0%{transform:translateX(-100%) rotate(25deg);}
  100%{transform:translateX(100%) rotate(25deg);}
}

@keyframes pulseIcon{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

.painel-topo{
  position:fixed;
  top:15px;
  left:25px;
  z-index:1000;

  width:320px;
  padding:22px;

  border-radius:25px;
  overflow:hidden;

  background:linear-gradient(145deg,
    rgba(0,245,255,0.08),
    rgba(34,255,136,0.05)
  );

  backdrop-filter:blur(25px);
  border:1px solid rgba(0,245,255,0.4);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.7),
    0 0 25px rgba(0,245,255,0.15);

  animation:fadeInPainel 0.5s ease;
}

/* brilho animado */
.painel-topo::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.08),
    transparent
  );
  transform:rotate(25deg);
  animation:shinePainel 4s infinite linear;
}

.painel-bloco{
  margin-bottom:18px;
  padding:12px 15px;
  border-radius:15px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
}

.painel-bloco strong{
  display:block;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:6px;
  color:var(--primary);
}

.painel-data{
  font-size:15px;
  font-weight:600;
  color:#fff;
}

/* anima  es */
@keyframes fadeInPainel{
  from{opacity:0; transform:translateY(-10px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes shinePainel{
  0%{transform:translateX(-100%) rotate(25deg);}
  100%{transform:translateX(100%) rotate(25deg);}
}

.qtd-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:8px;
}

.qtd-item{
  background:rgba(255,255,255,0.06);
  padding:8px;
  border-radius:12px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.08);
}

.qtd-item span{
  display:block;
  font-size:18px;
  font-weight:800;
  color:var(--accent);
}

.qtd-item small{
  font-size:11px;
  letter-spacing:1px;
  opacity:0.7;
}

.scan-ativo {
  position: relative;
  overflow: hidden;
}

.scan-ativo::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 50%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(0,255,255,0.6),
    transparent
  );
  animation: scanMove 1.2s linear infinite;
}

@keyframes scanMove {
  0% { left: -100%; }
  100% { left: 150%; }
}

.data-atual{
  text-align:center;
  font-size:20px;
  font-weight:800;
  letter-spacing:1px;
  margin:15px 0 20px 0;
  padding:12px 30px;
  display:inline-block;
  border-radius:16px;
  background:linear-gradient(135deg,#00f5ff,#22ff88);
  color:#020617;
  box-shadow:
    0 8px 25px rgba(0,245,255,0.4),
    0 0 15px rgba(34,255,136,0.3);
}

.data-wrapper{
  display:flex;
  justify-content:center;
}

.data-wrapper{
  display:flex;
  justify-content:center;
}

/* BLOCO LOGÍSTICO PREMIUM */
.info-logistica-ultra{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-top:10px;
}

.info-bloco{
  flex:1;
  max-width:220px;
  padding:12px 16px;
  border-radius:14px;
  background:linear-gradient(145deg,#111827,#0f172a);
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s ease;
}

.info-bloco:hover{
  transform:translateY(-3px);
}

.info-titulo{
  font-size:10px;
  opacity:0.6;
}

.info-data{
  font-size:14px;
  font-weight:700;
}

.saida{
  border:1px solid #22ff88;
  box-shadow:0 0 15px rgba(34,255,136,0.3);
}
.destaque-data{
    color: #00ff88;
    text-shadow: 0 0 8px #00ff88;
}

/* Tag do grupo menor */
.grupo-tag-ultra{
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 10px;
}

/* Piscar quando for hoje */
.saida-hoje {
  animation: piscarSaida 1s infinite;
  border: 1px solid #22ff88 !important;
  box-shadow:
    0 0 15px #22ff88,
    0 0 30px rgba(34,255,136,0.6);
}

@keyframes piscarSaida {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

.planejamento{
  border:1px solid rgba(0,245,255,0.4);
  box-shadow:
    0 0 12px rgba(0,245,255,0.3),
    inset 0 0 8px rgba(0,245,255,0.1);
}

.painel-planejamento {
  display:none;
  background: linear-gradient(145deg, #1e1e2f, #151522);
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 0 30px rgba(0,0,0,0.6);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.painel-planejamento::before {
  content: "";
  position: absolute;
  width: 150%;
  height: 150%;
  background: radial-gradient(circle, rgba(0,255,136,0.1), transparent 70%);
  top: -40%;
  left: -20%;
  animation: moverLuz 6s linear infinite;
}

@keyframes moverLuz {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.painel-planejamento h2 {
  font-size: 18px;
  letter-spacing: 1px;
  margin-bottom: 15px;
  color: #00ff88;
  text-shadow: 0 0 10px #00ff88;
}

.planejamento .info-data{
  color:#00f5ff;
  font-weight:700;
}

.planejamento:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:
    0 0 20px rgba(0,245,255,0.6);
}

.info-saida {
    margin-top: 15px;
    padding: 12px 18px;
    background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
    border-left: 4px solid #00ff88;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    color: #ffffff;
    box-shadow: 0 0 15px rgba(0,255,136,0.4);
    transition: 0.3s;
}

/* Animação Neon Pulsando */
@keyframes neonPulse {
  0% { box-shadow: 0 0 5px #00ff88; }
  50% { box-shadow: 0 0 25px #00ff88, 0 0 40px #00ff88; }
  100% { box-shadow: 0 0 5px #00ff88; }
}

.piscar-hoje {
  animation: neonPulse 1s infinite;
  border-left: 5px solid #00ff88 !important;
}

/* DESTAQUE NO GRID */
.loja-encontrada{
  background: linear-gradient(135deg,#00f5ff,#22ff88) !important;
  color:#020617 !important;
  transform:scale(1.15);
  box-shadow:
    0 0 20px #00f5ff,
    0 0 40px rgba(34,255,136,0.7);
  animation: pulseEncontrado 0.8s infinite alternate;
  z-index:2;
}

@keyframes pulseEncontrado{
  from{transform:scale(1.10);}
  to{transform:scale(1.18);}
}

.card-destacado{
  border:2px solid #00ff88 !important;
  box-shadow:
    0 0 35px rgba(0,255,136,0.7),
    0 25px 80px rgba(0,0,0,0.8);
}

.quadro-logistica-compacto{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
gap:8px;
margin-top:10px;
}

.mini-log{
padding:10px;
border-radius:10px;
text-align:center;

background:linear-gradient(145deg,#0f172a,#020617);

border:1px solid rgba(255,255,255,0.1);

font-family:'Poppins',sans-serif;

box-shadow:
0 0 10px rgba(0,0,0,0.7),
inset 0 0 5px rgba(255,255,255,0.05);

transition:0.2s;
}

.mini-log:hover{
transform:scale(1.05);
}

.mini-titulo{
font-size:9px;
letter-spacing:1px;
opacity:0.7;
}

.mini-valor{
font-size:13px;
font-weight:700;
margin-top:2px;
}

/* cores */

.mini-log.azul{
border-color:#00f5ff;
box-shadow:0 0 8px rgba(0,245,255,0.4);
}

.mini-log.verde{
border-color:#00ff88;
box-shadow:0 0 8px rgba(0,255,136,0.4);
}

.mini-log.amarelo{
border-color:#ffcc00;
box-shadow:0 0 8px rgba(255,204,0,0.4);
}

.quadro-nao-encontrado{

margin-top:25px;
padding:25px;

border-radius:16px;

background:linear-gradient(145deg,#020617,#0f172a);

border:2px solid rgba(255,80,80,0.5);

text-align:center;

box-shadow:
0 0 25px rgba(255,0,80,0.3),
inset 0 0 15px rgba(255,255,255,0.05);

animation:aparecerErro 0.4s ease;
}

.icone-alerta{
font-size:28px;
margin-bottom:8px;

filter:drop-shadow(0 0 6px red);
}

.titulo-erro{

font-size:18px;
font-weight:700;

color:#ff4d4d;

letter-spacing:1px;

text-shadow:0 0 8px rgba(255,0,0,0.5);
}

.subtexto{

margin-top:6px;

font-size:13px;

opacity:0.75;
}

@keyframes aparecerErro{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* ===========================
   TIMELINE LOGÍSTICA PREMIUM
=========================== */

.timeline-logistica{
  margin-top:15px;
  padding:20px;
  border-radius:18px;
  background:linear-gradient(145deg,#0f172a,#111827);
  border:1px solid rgba(0,255,255,0.2);
  box-shadow:
    0 0 25px rgba(0,255,255,0.15),
    0 15px 40px rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:relative;
  overflow:hidden;
}

/* brilho suave animado */
.timeline-logistica::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(0,255,255,0.05),
    transparent
  );
  animation: brilhoTimeline 6s linear infinite;
}

@keyframes brilhoTimeline{
  0%{transform:translateX(-100%) rotate(25deg);}
  100%{transform:translateX(100%) rotate(25deg);}
}

.bloco-logistica{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  border-radius:14px;
  min-width:190px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s ease;
}

.bloco-logistica:hover{
  transform:scale(1.05);
}

.icone-log{
  font-size:22px;
}

.titulo-log{
  display:block;
  font-size:11px;
  letter-spacing:1px;
  opacity:0.6;
}

.data-log{
  font-size:14px;
  font-weight:700;
  letter-spacing:0.5px;
}

/* Planejamento */
.planejamento-box{
  border-left:4px solid #00f5ff;

  left:-50%;

    120deg,
    transparent,
    rgba(255,255,255,0.06),

/* DATA CARREGO + SA DA */
function calcularDatas(diaCarrego){


  const hoje = new Date();
  const formatada = hoje.toLocaleDateString('pt-BR', {
    weekday: 'long',
    day: '2-digit',
    month: 'long',
    year: 'numeric'
  });

  document.getElementById("dataAtual").innerText = formatada.toUpperCase();

  const mapaDias = {
    "segunda":1,
    "terca":2,
    "quarta":3,
    "quinta":4,
    "sexta":5
  };

  const nomesDias = [
    "Domingo","Segunda","Terca","Quarta",
    "Quinta","Sexta","Sabado"
  ];

  let diaNumeroSemana = mapaDias[diaCarrego];
  let dataCarrego = new Date(hoje);

  while(dataCarrego.getDay() !== diaNumeroSemana){
    dataCarrego.setDate(dataCarrego.getDate()+1);
  }

  let dataSaida = new Date(dataCarrego);

  if(diaCarrego === "quinta"){
      dataSaida.setDate(dataSaida.getDate()+4);
  }
  else if(diaCarrego === "sexta"){
      dataSaida.setDate(dataSaida.getDate()+4);
  }
  else{
      dataSaida.setDate(dataSaida.getDate()+2);
  }

  const formatar = (data)=>{
    const dia = String(data.getDate()).padStart(2,'0');
    const mes = String(data.getMonth()+1).padStart(2,'0');
    const ano = data.getFullYear();
    const nomeDia = nomesDias[data.getDay()];
    return `${dia}/${mes}/${ano}   ${nomeDia}`;
  }

  return {
    carrego: formatar(dataCarrego),
    saida: formatar(dataSaida)
  };
}

const selectDia = document.getElementById("selectDia");

// Preenche dias do mês atual
function preencherDias() {
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = hoje.getMonth();

  const ultimoDia = new Date(ano, mes + 1, 0).getDate();

  selectDia.innerHTML = "";

  for (let i = 1; i <= ultimoDia; i++) {

    const dataTeste = new Date(ano, mes, i);
    const diaSemana = dataTeste.getDay(); // 0 = domingo | 6 = sábado

    // ? Ignora sábado e domingo
    if (diaSemana === 0 || diaSemana === 6) continue;

    const option = document.createElement("option");
    option.value = i;

    let texto = dataTeste.toLocaleDateString('pt-BR', {
      weekday: 'long',
      day: '2-digit'
    }).toUpperCase();

    // ?? Se for hoje
    if (i === hoje.getDate()) {
      texto = " HOJE - " + texto;
      option.selected = true;
    }

    option.textContent = texto;
    selectDia.appendChild(option);
  }
}

function atualizarSaida() {
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = hoje.getMonth();
  const diaSelecionado = parseInt(selectDia.value);

  const data = new Date(ano, mes, diaSelecionado);

  const dataFormatada = data.toLocaleDateString('pt-BR', {
    weekday: 'long',
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  });

  const info = document.getElementById("infoSaida");

  info.innerHTML =
    ` Saida Para a Loja: <span style="color:#00ff88">${dataFormatada}</span>`;

  //  Verifica se é hoje
  if (
    diaSelecionado === hoje.getDate() &&
    mes === hoje.getMonth() &&
    ano === hoje.getFullYear()
  ) {
    info.classList.add("piscar-hoje");
  } else {
    info.classList.remove("piscar-hoje");
  }
}
