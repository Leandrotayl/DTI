<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerador Inteligente de TAG</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#020617,#0f172a,#020617);
    color:#fff;
}

/* CARD */
.container{
    width:380px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.08);
    animation:fadeIn .6s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#38bdf8;
    letter-spacing:1px;
}

/* INPUTS */
select,input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:#020617;
    color:#fff;
    outline:none;
    border:1px solid #1e293b;
    transition:.3s;
}

select:focus,input:focus{
    border-color:#38bdf8;
    box-shadow:0 0 10px #38bdf8;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #22c55e;
}

/* RESULT */
.resultado{
    margin-top:20px;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#38bdf8;
    border-radius:10px;
    background:#020617;
    border:1px solid #1e293b;
    letter-spacing:2px;
}

/* CONTADOR */
.info{
    margin-top:10px;
    font-size:13px;
    text-align:center;
    color:#94a3b8;
}

/* COPY BUTTON */
.copy{
    margin-top:10px;
    background:#0ea5e9;
}

.copy:hover{
    box-shadow:0 0 15px #0ea5e9;
}

.toast{
    position:fixed;
    top:20px;
    right:20px;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
    opacity:0;
    transform:translateX(100px);
    transition:0.4s ease;
    z-index:9999;
}

.toast.show{
    opacity:1;
    transform:translateX(0);
}

.painel{
    position:fixed;
    top:0;
    right:-400px;
    width:350px;
    height:100%;
    background:#0f172a;
    box-shadow:-10px 0 30px rgba(0,0,0,0.6);
    transition:0.4s ease;
    padding:20px;
    overflow-y:auto;
    z-index:9999;
    border-left:1px solid #1e293b;
}

.painel.ativo{
    right:0;
}

.painel .topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.painel h3{
    color:#38bdf8;
}

.painel button{
    background:#ef4444;
    padding:5px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    color:#fff;
}

.item{
    background:#1e293b;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    font-size:14px;
    border-left:3px solid #38bdf8;
}

</style>
</head>

<body>

<div class="container">

<div id="toast" class="toast">Copiado com sucesso!</div>

<button onclick="abrirHistorico()" style="background:#0ea5e9;margin-top:10px;">
    TAGS GERADAS
</button>

<div id="painelHistorico" class="painel">
    <div class="topo">
        <h3>Histórico de Tags</h3>
        <button onclick="fecharHistorico()">X</button>
    </div>

    <div id="conteudoHistorico"></div>
</div>

    <h2>GERADOR DE TAG</h2>

   <select id="tipo" onchange="mostrarCampo()">
    <option value="">Selecione o Tipo</option>

    <option value="LAS">LAS - Impressoras Laser</option>
    <option value="IMP">IMP - Impressoras</option>
    <option value="LTR">LTR - Leitor de Código de Barras</option>
    <option value="AXE">AXE - Terminal Axel</option>
    <option value="DSK">DSK - Computadores</option>
    <option value="NOT">NOT - Notebooks</option>
    <option value="MON">MON - Monitores</option>
    <option value="ACP">ACP - Access Point</option>
    <option value="RCK">RCK - Rack</option>
    <option value="REP">REP - Relógio de Ponto</option>
    <option value="PDV">PDV - PDVs</option>
    </select>

    <div id="campoLoja" style="display:none;">
<input type="text" id="sigla" placeholder="SIGLA DA LOJA (EX: ABC)" onkeydown="verificarEnter(event)">
        <button onclick="gerarTag()">GERAR TAG</button>
    </div>

    <div class="resultado" id="resultado">---</div>
    <div class="info" id="info"></div>

    <button class="copy" onclick="copiar()">COPIAR TAG</button>

</div>

<script>

function verificarEnter(event){
    if(event.key === "Enter"){
        gerarTag();
    }
}

function mostrarCampo(){
    document.getElementById("campoLoja").style.display =
        document.getElementById("tipo").value ? "block" : "none";
}

function gerarTag(){
    let tipo = document.getElementById("tipo").value;
    let sigla = document.getElementById("sigla").value.toUpperCase().trim();

    if(!sigla){
        alert("Digite a sigla da loja!");
        return;
    }

    sigla = sigla.replace("CSA","");

    let chave = tipo + "_" + sigla;
    let contador = localStorage.getItem(chave);

    contador = contador ? parseInt(contador) + 1 : 1;
    localStorage.setItem(chave, contador);

    let resultado, numero;

    if(tipo === "PDV"){
        numero = String(contador).padStart(2,'0');
        resultado = `PDV${sigla}${numero}`;
    } else {
        numero = String(contador).padStart(3,'0');
        resultado = `CSA${sigla}${tipo}${numero}`;
    }

    // 🔥 MOSTRA NA TELA
    document.getElementById("resultado").innerText = resultado;

    document.getElementById("info").innerText =
        `Sequência atual: ${numero} | Loja: ${sigla} | Tipo: ${tipo}`;

    // 🚀 SALVA AUTOMATICAMENTE NO HISTÓRICO
    salvarHistorico(sigla, resultado);
}

function salvarHistorico(sigla, tag){
    let key = "historico_" + sigla;

    let dados = JSON.parse(localStorage.getItem(key)) || [];

    dados.unshift({
        tag: tag,
        data: new Date().toLocaleString()
    });

    localStorage.setItem(key, JSON.stringify(dados));
}

function abrirHistorico(){
    let sigla = document.getElementById("sigla").value.toUpperCase().trim().replace("CSA","");

    let dados = JSON.parse(localStorage.getItem("historico_" + sigla)) || [];

    let html = "";

    if(dados.length === 0){
        html = "<p style='color:#94a3b8'>Nenhuma tag gerada ainda.</p>";
    } else {
        dados.forEach(item => {
            html += `
                <div class="item">
                    <div style="font-weight:bold;color:#38bdf8">${item.tag}</div>
                    <div style="font-size:11px;color:#94a3b8">${item.data}</div>
                </div>
            `;
        });
    }

    document.getElementById("conteudoHistorico").innerHTML = html;
    document.getElementById("painelHistorico").classList.add("ativo");
}

function copiar(){
    let texto = document.getElementById("resultado").innerText;

    if(texto === "---") return;

    navigator.clipboard.writeText(texto);

    mostrarToast("TAG copiada com sucesso!");
}

function mostrarToast(mensagem){
    let toast = document.getElementById("toast");

    toast.innerText = mensagem;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}

</script>

</body>
</html>
