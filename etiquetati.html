<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etiqueta TI Ultra</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Segoe UI',sans-serif;
    background: radial-gradient(circle at top,#0f2027,#203a43,#2c5364);
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

/* TÍTULO */
h1{
    font-size:28px;
    margin-bottom:20px;
    letter-spacing:1px;
    align-self:flex-start;
}

/* CONTAINER */
.container{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
    justify-content:center;
}

/* FORM */
.form-box{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    padding:20px;
    border-radius:15px;
    width:300px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    transition:0.3s;
}

.form-box:hover{
    transform:scale(1.02);
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,0.15);
    color:#fff;
    outline:none;
}

/* BOTÕES */
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:linear-gradient(45deg,#00c6ff,#0072ff);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 15px #00c6ff;
}

/* ETIQUETA */
.etiqueta{
    width:380px;
    height:230px;
    background:#fff;
    color:#000;
    border-radius:12px;
    padding:12px;
    position:relative;
    display:none;
    animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:scale(0.9);}
    to{opacity:1; transform:scale(1);}
}

.logo{
    width:60px;
    position:absolute;
    top:8px;
    right:8px;
    opacity:0.9;
}

.linha{
    font-size:13px;
    margin:3px 0;
}

#barcode{
    width:100%;
    height:45px;
    margin-top:5px;
}

#qrcode{
    position:absolute;
    bottom:5px;
    right:5px;
}

/* DASHBOARD */
.dashboard{
    position: absolute;
    top: 20px;
    right: 20px;
    display:flex;
    gap:10px;
    background:rgba(0,0,0,0.2);
    padding:10px;
    border-radius:12px;
    backdrop-filter: blur(10px);
    z-index: 1000;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:15px;
    border-radius:12px;
    text-align:center;
    width:150px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.card h3{
    font-size:14px;
    margin-bottom:5px;
}

.card span{
    font-size:22px;
    font-weight:bold;
    color:#00c6ff;
}

/* HISTÓRICO */
.historico{
    width:320px;
    max-height:400px;
    overflow:auto;
    background:rgba(255,255,255,0.08);
    border-radius:10px;
    padding:10px;
}

.item{
    background:rgba(255,255,255,0.9);
    color:#000;
    padding:8px;
    margin:6px 0;
    border-radius:6px;
    cursor:pointer;
    transition:0.2s;
}

.item:hover{
    background:#00c6ff;
    color:#fff;
    transform:scale(1.02);
}

/* MODAL EXCLUSÃO */
.modal {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    animation: fadeIn 0.3s;
}

.modal-content {
    background: #1e293b;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    width: 300px;
    color: #fff;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    animation: slideIn 0.3s ease-out;
}

.modal-content h3 {
    margin-bottom: 10px;
    color: #ff4d4d;
}

.modal-content p {
    font-size: 14px;
    margin-bottom: 20px;
}

.modal-buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.modal-buttons button {
    flex:1;
    padding: 10px;
    border:none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

#cancelarExcluir {
    background: rgba(255,255,255,0.2);
    color:#fff;
}

#cancelarExcluir:hover {
    background: #fff;
    color:#ff4d4d;
    transform: translateY(-2px);
}

#confirmarExcluir {
    background: #ff4d4d;
    color:#fff;
}

#confirmarExcluir:hover {
    background: #ff1a1a;
    transform: translateY(-2px);
}

@keyframes slideIn {
    from { transform: translateY(-20px); opacity:0; }
    to { transform: translateY(0); opacity:1; }
}

/* PRINT */
@media print{
    body *{visibility:hidden;}
    .etiqueta,.etiqueta *{visibility:visible;}
    .etiqueta{
        position:absolute;
        top:0;
        left:0;
        width:100mm;
        height:60mm;
        box-shadow:none;
    }
}
</style>
</head>

<body>

<h1> Etiqueta TI Ultra</h1>

<div class="dashboard">
    <div class="card">
        <h3>Total</h3>
        <span id="total">0</span>
    </div>

    <div class="card">
        <h3>Última</h3>
        <span id="ultima">-</span>
    </div>

    <div class="card">
        <h3>Top Técnico</h3>
        <span id="topTec">-</span>
    </div>
</div>

<canvas id="grafico" height="120"></canvas>

<div class="container">

<!-- FORM -->
<div class="form-box">
    <input id="tecnico" placeholder="Nome do Técnico">
    <input id="chamado" placeholder="Chamado TI">
    <input id="os" placeholder="OS">
    <input id="inventario" placeholder="Inventário">

    <button onclick="salvar()"> Salvar</button>
    <button onclick="window.print()"> Imprimir</button>
    <button onclick="pdf()"> PDF</button>
</div>

<!-- ETIQUETA -->
<div class="etiqueta" id="etiqueta">
<img src="http://172.16.2.7/DTI/img/bola.png" class="logo">
    <div class="linha"><b>Técnico:</b> <span id="eTec"></span></div>
    <div class="linha"><b>Chamado:</b> <span id="eChamado"></span></div>
    <div class="linha"><b>OS:</b> <span id="eOS"></span></div>
    <div class="linha"><b>Inventário:</b> <span id="eInv"></span></div>
    <svg id="barcode"></svg>
    <div id="qrcode"></div>
</div>

<!-- HISTÓRICO -->
<div class="historico" id="historico">
    <b> Histórico</b>
</div>

</div>

<!-- MODAL EXCLUSÃO -->
<div id="modalExcluir" class="modal">
    <div class="modal-content">
        <h3>⚠️ Excluir etiqueta?</h3>
        <p>Essa ação não pode ser desfeita.</p>
        <div class="modal-buttons">
            <button id="cancelarExcluir">Cancelar</button>
            <button id="confirmarExcluir">Excluir</button>
        </div>
    </div>
</div>

<script>
const tecnico = document.getElementById('tecnico');
const chamado = document.getElementById('chamado');
const os = document.getElementById('os');
const inv = document.getElementById('inventario');
const historico = document.getElementById('historico');

[tecnico,chamado,os,inv].forEach(i=>{ i.addEventListener("input", atualizar); });

function atualizar(){
    document.getElementById('etiqueta').style.display="block";
    eTec.innerText = tecnico.value;
    eChamado.innerText = chamado.value;
    eOS.innerText = os.value;
    eInv.innerText = inv.value;

    document.getElementById("qrcode").innerHTML="";

    if(inv.value){
        new QRCode(document.getElementById("qrcode"), {
            text: inv.value,
            width: 60,
            height: 60
        });

        JsBarcode("#barcode", inv.value, {
            format: "CODE128",
            displayValue: true,
            fontSize: 14
        });
    }
}

let chart;
let itemExcluirIndex = null;

/* DASHBOARD */
function atualizarDashboard(){
    let lista = JSON.parse(localStorage.getItem("etiquetas")||"[]");
    document.getElementById("total").innerText = lista.length;
    document.getElementById("ultima").innerText = lista.length ? lista[lista.length-1].inv : "-";

    let contagem = {};
    lista.forEach(e=>{ contagem[e.tecnico] = (contagem[e.tecnico]||0)+1; });
    let top = Object.entries(contagem).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById("topTec").innerText = top ? top[0] : "-";

    let labels = Object.keys(contagem);
    let valores = Object.values(contagem);
    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("grafico"), {
        type: 'bar',
        data: { labels: labels, datasets: [{ label: 'Etiquetas por Técnico', data: valores }] },
        options: { plugins:{legend:{display:false}} }
    });
}

/* TOAST */
function toast(msg, cor="#00c6ff"){
    const t = document.createElement("div");
    t.innerText = msg;
    t.style.position="fixed";
    t.style.bottom="20px";
    t.style.right="20px";
    t.style.background=cor;
    t.style.padding="12px 20px";
    t.style.borderRadius="8px";
    t.style.color="#fff";
    t.style.boxShadow="0 0 15px rgba(0,0,0,0.3)";
    t.style.zIndex="999";
    t.style.animation="fadeIn 0.3s";
    document.body.appendChild(t);
    setTimeout(()=> t.remove(),2000);
}

/* SALVAR */
function salvar(){
    if(!tecnico.value || !inv.value){
        toast("Preencha Técnico e Inventário!", "#ff4d4d"); return;
    }

    let lista = JSON.parse(localStorage.getItem("etiquetas")||"[]");
    lista.push({ tecnico: tecnico.value, chamado: chamado.value, os: os.value, inv: inv.value });
    localStorage.setItem("etiquetas", JSON.stringify(lista));

    toast("Etiqueta salva com sucesso!");
    limpar(); carregar(); atualizarDashboard();
}

/* LIMPAR */
function limpar(){
    tecnico.value=""; chamado.value=""; os.value=""; inv.value="";
    document.getElementById('etiqueta').style.display="none";
    tecnico.focus();
}

/* CARREGAR */
function carregar(){
    let lista = JSON.parse(localStorage.getItem("etiquetas")||"[]");
    historico.innerHTML="<b> Histórico</b>";

    [...lista].reverse().forEach((d,index)=>{
        let div=document.createElement("div");
        div.className="item";
        div.innerHTML = `${d.inv} - ${d.tecnico} <span style="float:right; color:red; cursor:pointer;">✖</span>`;

        div.onclick=(e)=>{
            if(e.target.innerText==="✖") return;
            tecnico.value=d.tecnico; chamado.value=d.chamado; os.value=d.os; inv.value=d.inv; atualizar();
        };

        div.querySelector("span").onclick=()=>{
            itemExcluirIndex = lista.length-1-index;
            document.getElementById("modalExcluir").style.display = "flex";
        };

        historico.appendChild(div);
    });
}

/* MODAL EXCLUSÃO */
document.getElementById("cancelarExcluir").onclick = () => {
    document.getElementById("modalExcluir").style.display = "none";
    itemExcluirIndex = null;
};

document.getElementById("confirmarExcluir").onclick = () => {
    let lista = JSON.parse(localStorage.getItem("etiquetas")||"[]");
    if(itemExcluirIndex!==null){
        lista.splice(itemExcluirIndex,1);
        localStorage.setItem("etiquetas", JSON.stringify(lista));
        carregar();
        toast("Etiqueta excluída!", "#ff4d4d");
        document.getElementById("modalExcluir").style.display = "none";
        itemExcluirIndex=null;
        atualizarDashboard();
    }
};

/* PDF */
function pdf(){
    if(!inv.value){ toast("Nada para gerar PDF!", "#ff4d4d"); return; }
    html2pdf().from(document.getElementById("etiqueta")).save("Etiqueta_TI.pdf");
}

carregar(); 
atualizarDashboard();
</script>

</body>
</html>
