.consulta-alert{

}

/* Vertical */
.consulta-alert::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:14px;
  padding:2px;
  background:
    linear-gradient(#00ffc8,#00ffc8) left,
    linear-gradient(#00ffc8,#00ffc8) right,
    linear-gradient(#ffcc00,#ffcc00) top,
    linear-gradient(#ffcc00,#ffcc00) bottom;

  background-size:
    2px 100%,
    2px 100%,
    100% 2px,
    100% 2px;

  background-repeat:no-repeat;
  pointer-events:none;
}

.cidadeResumo{
  position:relative;
  display:inline-block;
  margin-top:8px;
  padding:10px 20px;

  font-size:0.80em;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;

  color:#7CFFB2;

  text-shadow:
    0 0 6px rgba(124,255,178,0.6),
    0 0 18px rgba(124,255,178,0.3);

  animation:fadeCidade 0.5s ease forwards;
}

/* Moldura animada */
.cidadeResumo::before{
  content:"";
  position:absolute;
  inset:0;
  border:2px solid transparent;
  border-radius:6px;

  background:
    linear-gradient(#00ff88,#00ff88) top left,
    linear-gradient(#00ff88,#00ff88) top right,
    linear-gradient(#00ff88,#00ff88) bottom right,
    linear-gradient(#00ff88,#00ff88) bottom left;

  background-size:0% 2px, 2px 0%, 0% 2px, 2px 0%;
  background-repeat:no-repeat;

  animation:fecharQuadro 0.8s ease forwards;
}

/* Anima  o fechando o quadro */
@keyframes fecharQuadro{
  0%{
    background-size:
      0% 2px,
      2px 0%,
      0% 2px,
      2px 0%;
  }
  25%{
    background-size:
      100% 2px,
      2px 0%,
      0% 2px,
      2px 0%;
  }
  50%{
    background-size:
      100% 2px,
      2px 100%,
      0% 2px,
      2px 0%;
  }
  75%{
    background-size:
      100% 2px,
      2px 100%,
      100% 2px,
      2px 0%;
  }
  100%{
    background-size:
      100% 2px,
      2px 100%,
      100% 2px,
      2px 100%;
  }
}

@keyframes fadeCidade{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

];

let usuarioLogado = null;

function fazerLogin(){
  const user = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;

  const encontrado = usuarios.find(u => u.user === user && u.senha === pass);

 if(encontrado){
  usuarioLogado = encontrado;

  localStorage.setItem("usuarioLogado", JSON.stringify(encontrado));

  document.getElementById("loginScreen").style.display = "none";

  atualizarBotaoUsuario(); // 👈 IMPORTANTE


  } else {
    document.getElementById("loginErro").textContent = "Usuário ou senha inválidos";
  }
}

window.onload = function(){
  const salvo = localStorage.getItem("usuarioLogado");

  if(salvo){
    usuarioLogado = JSON.parse(salvo);
    document.getElementById("loginScreen").style.display = "none";
  }

  atualizarBotaoUsuario(); // 👈 AQUI TAMBÉM
};

  if(usuarioLogado){
    document.getElementById("userInfo").innerHTML = 
      `👤 ${usuarioLogado.user} (${usuarioLogado.nivel})`;
  }
}

  }

function destacarTexto(texto, termo){
  if(!termo) return texto;

  const regex = new RegExp(`(${termo})`, "gi");
  return texto.replace(regex, `<span class="destaque-busca">$1</span>`);
}

    btnTop.classList.add("show");

let resultadoAtual = [];

function aplicarFiltros() {

  const termoBusca = document.getElementById('searchInput').value.toLowerCase();

  const filtroTipo = document.getElementById('filtroTipo');
  const filtroDispositivo = document.getElementById('filtroDispositivo');

  const tipoSelecionado = filtroTipo ? filtroTipo.value : 'todos';
  const dispositivoSelecionado = filtroDispositivo ? filtroDispositivo.value : 'todos';

  resultadoAtual = lojas.filter(loja => {

    const correspondeBusca =
      loja.sigla.toLowerCase().includes(termoBusca) ||
      loja.ip.toLowerCase().includes(termoBusca);

    const correspondeTipo =
      tipoSelecionado === 'todos' ||
      loja.tipo === tipoSelecionado;

    const correspondeDispositivo =
      dispositivoSelecionado === 'todos' ||
      loja.dispositivo === dispositivoSelecionado;

    return correspondeBusca && correspondeTipo && correspondeDispositivo;
  });

  if (resultadoAtual.length === 0) {
    telaLojas.innerHTML = "<p style='margin-top:30px;'>Nenhum Resultado Encontrado.</p>";
  } else {
    mostrarTabela(resultadoAtual);
  }

  telaRegionais.style.display = 'none';
  backBtn.style.display = 'inline-block';

  atualizarResumo(resultadoAtual);

  document.getElementById('btnDownload').style.display =
    resultadoAtual.length > 0 ? 'inline-block' : 'none';
}

function filtrarLegenda(tipo, valor, elemento){

  // Alternar sele  o
  if(tipo === 'tipo'){
    filtroTipoAtivo = (filtroTipoAtivo === valor) ? null : valor;
  } else {
    filtroDispositivoAtivo = (filtroDispositivoAtivo === valor) ? null : valor;
  }

  // Remove sele  o visual
  document.querySelectorAll('.legenda-item').forEach(el => {
    el.classList.remove('ativo');
  });

  // Marca os ativos
  document.querySelectorAll('.legenda-item').forEach(el => {
    if(el.textContent === filtroTipoAtivo || el.textContent === filtroDispositivoAtivo){
      el.classList.add('ativo');
    }
  });

  aplicarFiltroLegenda();
}

function aplicarFiltroLegenda(){

  let listaFiltrada = lojas.filter(l => {

    const tipoOk = !filtroTipoAtivo || l.tipo === filtroTipoAtivo;
    const dispOk = !filtroDispositivoAtivo || l.dispositivo === filtroDispositivoAtivo;

    return tipoOk && dispOk;
  });

  if(listaFiltrada.length === 0){
    telaLojas.innerHTML = "<p style='margin-top:30px;'>Nenhum resultado encontrado.</p>";
  } else {
    mostrarTabela(listaFiltrada);
  }

  atualizarResumo(listaFiltrada);
}


function baixarResultado() {
  if (resultadoAtual.length === 0) return;

  let csv = "Sigla,Filial,Tipo,IP,Dispositivo\n";

  resultadoAtual.forEach(loja => {
    csv += `${loja.sigla},${loja.filial},${loja.tipo},${loja.ip},${loja.dispositivo}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = "resultado_filtro_claudino.csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function baixarExcel() {
  if (resultadoAtual.length === 0) return;

  // Cria uma planilha XLSX
  const ws_data = [
    ["Sigla","Filial","Tipo","IP","Dispositivo","Cidade","PDVs"]
  ];

  resultadoAtual.forEach(loja => {
    ws_data.push([
      loja.sigla,
      loja.filial,
      loja.tipo,
      loja.ip,
      loja.dispositivo,
      loja.cidade,
      loja.pdvs.join(", ")
    ]);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(ws_data);
  XLSX.utils.book_append_sheet(wb, ws, "Resultado");
  XLSX.writeFile(wb, "resultado_filtro_claudino.xlsx");
}

function atualizarResumo(lista = lojas) {

  const totalForti = lista.filter(l=>l.dispositivo.toLowerCase()==="fortigate").length;
  const totalMikrotik = lista.filter(l=>l.dispositivo.toLowerCase()==="mikrotik").length;
  const totalFilial = lista.filter(l=>l.tipo.toLowerCase()==="filial").length;
  const totalPostos = lista.filter(l=>l.tipo.toLowerCase()==="posto").length;
  const totalDeposito = lista.filter(l=>l.tipo.toLowerCase()==="deposito").length;
  const totalRep = lista.filter(l=>l.tipo.toLowerCase()==="representante").length;
  const totalGeral = lista.length;

  document.getElementById('totalForti').textContent = totalForti;
  document.getElementById('totalMikrotik').textContent = totalMikrotik;
  document.getElementById('totalFilial').textContent = totalFilial;
  document.getElementById('totalPostos').textContent = totalPostos;
  document.getElementById('totalDeposito').textContent = totalDeposito;
  document.getElementById('totalRep').textContent = totalRep;
  document.getElementById('totalGeral').textContent = totalGeral;
}
