<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Carrego</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#00f5ff;
  --accent:#22ff88;
  --glass:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.15);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  background:radial-gradient(circle at 20% 30%,#0f172a,#020617 70%);
  color:#fff;
}

/* HEADER */
header{
  padding:40px 20px 20px;
  text-align:center;
}

.titulo{
  font-size:34px;
  font-weight:800;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.data{
  margin-top:8px;
  opacity:0.8;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:20px;
}

/* BUSCA */
.search-box{
  display:flex;
  justify-content:center;
  margin-bottom:40px;
}

.search-box input{
  width:100%;
  max-width:400px;
  padding:15px 20px;
  border-radius:50px;
  border:1px solid var(--border);
  background:var(--glass);
  backdrop-filter:blur(20px);
  color:#fff;
  font-size:16px;
  text-align:center;
  outline:none;
}

/* GRID DIA */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:30px;
}

.card{
  background:var(--glass);
  backdrop-filter:blur(25px);
  border:1px solid var(--border);
  border-radius:25px;
  padding:30px;
  transition:0.4s;
}

.card:hover{
  transform:translateY(-8px);
  border:1px solid var(--primary);
}

.card h3{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

.badge{
  padding:6px 14px;
  border-radius:20px;
  background:linear-gradient(90deg,var(--accent),var(--primary));
  color:#000;
  font-weight:600;
  font-size:14px;
  margin:5px;
  display:inline-block;
}

.loja{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin:6px;
  padding:10px 18px;
  min-width:60px;
  height:45px;

  background:linear-gradient(180deg,#ff1a1a,#cc0000);
  color:#fff;
  font-weight:700;
  font-size:16px;

  border:2px solid #ffffff;
  border-radius:12px;

  box-shadow:
    0 4px 10px rgba(0,0,0,0.5),
    inset 0 2px 4px rgba(255,255,255,0.3);

  transition:0.3s ease;
}

.loja:hover{
  transform:scale(1.08);
  box-shadow:
    0 6px 18px rgba(255,0,0,0.6),
    inset 0 2px 6px rgba(255,255,255,0.4);
}

.nao-encontrado{
  position:relative;
  padding:30px 25px;
  border-radius:25px;
  text-align:center;
  overflow:hidden;

  background:linear-gradient(145deg,
    rgba(255,0,0,0.08),
    rgba(255,0,0,0.02)
  );

  border:1px solid rgba(255,0,0,0.5);

  box-shadow:
    0 15px 40px rgba(0,0,0,0.7),
    0 0 25px rgba(255,0,0,0.2);

  animation:fadeInScale 0.4s ease;
}

/* brilho animado */
.nao-encontrado::before{
  content:"";
  position:absolute;
  top:-40%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.08),
    transparent
  );
  transform:rotate(25deg);
  animation:shine 3s infinite linear;
}

.nao-encontrado .icone{
  font-size:45px;
  margin-bottom:12px;
  animation:pulseIcon 1.5s infinite ease-in-out;
}

.nao-encontrado .titulo-erro{
  font-size:20px;
  font-weight:800;
  color:#ff4d4d;
  margin-bottom:8px;
  letter-spacing:1px;
}

.nao-encontrado .subtexto{
  font-size:14px;
  opacity:0.75;
}

/* anima  es */
@keyframes fadeInScale{
  from{opacity:0; transform:scale(0.9);}
  to{opacity:1; transform:scale(1);}
}

@keyframes shine{
  0%{transform:translateX(-100%) rotate(25deg);}
  100%{transform:translateX(100%) rotate(25deg);}
}

@keyframes pulseIcon{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

.painel-topo{
  position:fixed;
  top:25px;
  left:25px;
  z-index:1000;

  width:320px;
  padding:22px;

  border-radius:25px;
  overflow:hidden;

  background:linear-gradient(145deg,
    rgba(0,245,255,0.08),
    rgba(34,255,136,0.05)
  );

  backdrop-filter:blur(25px);
  border:1px solid rgba(0,245,255,0.4);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.7),
    0 0 25px rgba(0,245,255,0.15);

  animation:fadeInPainel 0.5s ease;
}

/* brilho animado */
.painel-topo::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.08),
    transparent
  );
  transform:rotate(25deg);
  animation:shinePainel 4s infinite linear;
}

.painel-bloco{
  margin-bottom:18px;
  padding:12px 15px;
  border-radius:15px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
}

.painel-bloco strong{
  display:block;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:6px;
  color:var(--primary);
}

.painel-data{
  font-size:15px;
  font-weight:600;
  color:#fff;
}

/* anima  es */
@keyframes fadeInPainel{
  from{opacity:0; transform:translateY(-10px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes shinePainel{
  0%{transform:translateX(-100%) rotate(25deg);}
  100%{transform:translateX(100%) rotate(25deg);}
}

.qtd-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:8px;
}

.qtd-item{
  background:rgba(255,255,255,0.06);
  padding:8px;
  border-radius:12px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.08);
}

.qtd-item span{
  display:block;
  font-size:18px;
  font-weight:800;
  color:var(--accent);
}

.qtd-item small{
  font-size:11px;
  letter-spacing:1px;
  opacity:0.7;
}



/* RESULTADO FLUTUANTE */
.resultado-flutuante{
  position:fixed;
  top:30px;
  right:30px;
  width:350px;
  max-height:80vh;
  overflow-y:auto;
  background:rgba(15,23,42,0.95);
  backdrop-filter:blur(25px);
  border:1px solid var(--primary);
  border-radius:25px;
  padding:25px;
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
  transform:translateX(120%);
  transition:0.4s ease;
  z-index:999;
}

.resultado-flutuante.ativo{
  transform:translateX(0);
}

.resultado-flutuante h3{
  margin-bottom:15px;
}

.fechar{
  position:absolute;
  top:15px;
  right:20px;
  cursor:pointer;
  font-size:18px;
  opacity:0.7;
}

.fechar:hover{
  opacity:1;
}

.destaque{
  background:yellow !important;
  color:#000 !important;
  padding:3px 8px;
  border-radius:8px;
  font-weight:700;
}

.info-box{
  background:rgba(255,255,255,0.05);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.data-saida{
  color:#22ff88;
  font-weight:700;
}

.label-azul{
  color: var(--primary);
  font-weight:700;
}

.label-amarelo{
  color: yellow;
  font-weight:700;
}


</style>
</head>
<body>

<div class="painel-topo">
  <div class="painel-bloco" id="infoPlanejamento"></div>
  <div class="painel-bloco" id="infoSaida"></div>
  <div class="painel-bloco" id="infoQuantidades"></div>
</div>




<header>
  <div class="titulo"> Planejamento de Carrego</div>
  <div class="data" id="dataAtual"></div>
</header>

<div class="container">

  <div class="search-box">
    <input type="text" id="pesquisa" placeholder="Pesquisar sigla da loja">
  </div>
  

  <div id="conteudo"></div>

</div>

<div id="resultadoFlutuante" class="resultado-flutuante">
  <div class="fechar" onclick="fecharResultado()">Fechar</div>
  <div id="resultadoConteudo"></div>
</div>

<script>

const lojasPorDia = {
    "segunda": { filiais:["BDF","LED","CDE","PDC","PID"], postos:["SRD","DSJ","CST","SMT","CAD","ALS","ALG","BNT","DBC","DPU"], lojas:["TES","TEU","TMA","TEZ","TIM","TEC","TED","TPP"] },
    "terca": { filiais:["DPC","FLD","PAR","TUT","DBH","TIA","SBT"], postos:["BDR","PRP","FRL","EVL","VAL","PMT","ARO","INH","DLB","MGL","MTS","PRN","CNE","IPI"], lojas:["TES","TPI","TEU","TMA","TMO","TSJ"] },
    "quarta": { filiais:["IDC","DAG","CDF","CDP"], postos:["ABR","PAL","ANG","AMA","SFR","REG","OEI","DCO","PBO","SPA"], lojas:["TES","TEU","TMA","TEZ","TIM","TEC","TED","TPP"] },
    "quinta": { filiais:["DPI","CUM","CHD","CTA","VAG","ITA","ROS","PDF","ARP"], postos:["CCT","DBJ","DCB","EMR","COG","ALS"], lojas:["TES","TPI","TEU","TMA","TMO","TSJ"] },
    "sexta": { filiais:["BAC","DSI","BCU","DZE","CTP","GDV","AMP","CME","SLP","LDO"], postos:["URU","RGO","BGR","BAR","NSR","LUZ","MIA","PRT","MIO","BAT","ESP","JPR","JFT","UNI"], lojas:["TES","TEU","TMA","TEZ","TIM","TEC","TED"] }
};

const carregos = {
   "XXX": ["XXX"],

   "BDF": ["BDF","BHM","BHI","ANB","BRA","COT","CRI","FRP","IBO","RNE","SAN","SDE","SMV","SRC","TBV","WAN","BAI","BBH","MAC","SDO","CBA",],
   "LED": ["LED"],
   "CDE": ["CDE","COR","GLB","PRG","CUR","JUB","RIF","SEB","MAL","SFO","ALP","CTL",],
   "PDC": ["PDC"],
   "PID": ["PID","PIR","BRS","CCA","PRA","SBT","PII","VIC","DGM","MAD","CLG","SJA"],
   "ARP": ["ARP"],
   "MCO": ["MCO"],

   "DPC": ["DPC"],
   "FLD": ["FLO","CAB","COG","GPE","ITE","MEM","MPA","SJX",],
   "PAR": ["BLO","CJP","COC","LCO","PCA","PJS","PPM","ARA","CHV","GRJ","CIM","BPR","CBP","CRB","IGP","MPO","CAV",],
   "TUT": ["TUT"],
   "DBH": ["DBH"],
   "TIA": ["TIA"],
   "SBT": ["SBT"],

   "IDC": ["IDC"],
   "DAG": ["DAG"],
   "CDF": ["CDF"],
   "CDP": ["CDP","CAX","BRJ","ALA","CXE","CVR","SJE",],

   "DPI": ["PIN","APA","ALC","BCR","MIZ","PNU","PSA","SBE","SHE","SVF","SJB","TUR","BEQ","CED","CEN","CJA","BCB","PAS","PEM","PME","SER","POM","GUI","TRF",],
   "CUM": ["CUM"],
   "CHD": ["CHD"],
   "CTA": ["CTA"],
   "VAG": ["VAG"],
   "ITA": ["ITA"],
   "ROS": ["ROS"],
   "PDF": ["PDF"],

   "BAC": ["BAC","ANJ","BBV","CAT","LCU","LGD","LVE","MIR","ALE","MTN","ODC","PIO","PIP","SAM","SLG","VIF","STB","PRM",,"BDA","BLU","AMI",],
   "DSI": ["DSI"],
   "BCU": ["BCU"],
   "DZE": ["DZE"],
   "CTP": ["CTP"],
   "GDV": ["GDV"],
   "AMP": ["AMP"],
   "CME": ["CME"],
   "SLP": ["SLP"],
   "LDO": ["LDO"],

   "URU": ["URU"],
   "RGO": ["RGO"],
   "BGR": ["BGR"],
   "BAR": ["BAR"],
   "NSR": ["NSR"],
   "LUZ": ["LUZ"],
   "MIA": ["MIA"],
   "PRT": ["PRT"],
   "MIO": ["MIO"],
   "BAT": ["BAT"],
   "ESP": ["ESP"],
   "JPR": ["JPR"],
   "JFT": ["JFT"],
   "UNI": ["UNI"],

   "TES": ["TES"],
   "TEU": ["TEU"],
   "TMA": ["TMA"],
   "TEZ": ["TEZ"],
   "TIM": ["TIM"],
   "TEC": ["TEC"],
   "TED": ["TED"],
   "TPP": ["TPP"],
   "TPI": ["TPI"],
   "TMO": ["TMO"],
   "TSJ": ["TSJ"],

   "ABR": ["ABR"], 
   "DPC": ["JAI"],
   "ANG": ["ANG"],
   "AMA": ["AMA"],
   "SFR": ["SFR"],
   "REG": ["REG"],
   "OEI": ["OEI"],
   "DCO": ["DCO"],
   "PBO": ["PBO"],
   "SPA": ["SPA"],
   "CCT": ["CCT"],
   "DBJ": ["DBJ","BOJ","RGR","SZP",],
   "DCB": ["DCB"],
   "EMR": ["EMR"],
   "COG": ["COG"],
   "ALS": ["ALS"],
   "SRD": ["SRD"],
   "DSJ": ["DSJ"],
   "CST": ["CST"],
   "SMT": ["SMT"],
   "CAD": ["CAD","CAM","BHO","BOP","JUP","LAL","SGP"],
   "ALS": ["ALS","SJS","NSA"],
   "ALG": ["ALG"],
   "BNT": ["BNT"],
   "DBC": ["DBC"],
   "DPU": ["DPU"],
   "BDR": ["DBR"],
   "PRP": ["PRP"],
   "FRL": ["FRL"],
   "EVL": ["EVL"],
   "VAL": ["VAL"],
   "PMT": ["PMT"],
   "ARO": ["ARO"],
   "INH": ["INH"],
   "DLB": ["DLB"],
   "MGL": ["MGL"],
   "MTS": ["MTS"],
   "PRN": ["PRN"],
   "CNE": ["CNE"],
   "IPI": ["IPI"],
};

/* DATA ATUAL */
const diasSemana = ["Domingo","Segunda","Terca","Quarta","Quinta","Sexta","Sabado"];
const hoje = new Date();
const nomeDia = diasSemana[hoje.getDay()];
const diaNumero = String(hoje.getDate()).padStart(2,'0');
const mesNumero = String(hoje.getMonth()+1).padStart(2,'0');
const ano = hoje.getFullYear();

document.getElementById("dataAtual").innerText =
  `${nomeDia} = ${diaNumero}/${mesNumero}/${ano}`;

const diaChave = nomeDia.toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

const conteudo = document.getElementById("conteudo");

if(diaChave === "sabado" || diaChave === "domingo"){
  conteudo.innerHTML = `<div class="card"> Hoje n o h  carrego programado.</div>`;
} else {

  const dados = lojasPorDia[diaChave];

  conteudo.innerHTML = `
    <div class="grid">
      ${Object.keys(dados).map(grupo => `
        <div class="card">
          <h3>${grupo.toUpperCase()} <span class="badge">${dados[grupo].length}</span></h3>
          ${dados[grupo].map(l => `<span class="loja">${l}</span>`).join("")}
        </div>
      `).join("")}
    </div>
  `;
}

/* DATA CARREGO + SA DA */
function calcularDatas(diaCarrego){

  const hoje = new Date();

  const mapaDias = {
    "segunda":1,
    "terca":2,
    "quarta":3,
    "quinta":4,
    "sexta":5
  };

  const nomesDias = [
    "Domingo","Segunda","Terca","Quarta",
    "Quinta","Sexta","S bado"
  ];

  let diaNumeroSemana = mapaDias[diaCarrego];
  let dataCarrego = new Date(hoje);

  while(dataCarrego.getDay() !== diaNumeroSemana){
    dataCarrego.setDate(dataCarrego.getDate()+1);
  }

  let dataSaida = new Date(dataCarrego);

  if(diaCarrego === "quinta"){
      dataSaida.setDate(dataSaida.getDate()+4);
  }
  else if(diaCarrego === "sexta"){
      dataSaida.setDate(dataSaida.getDate()+4);
  }
  else{
      dataSaida.setDate(dataSaida.getDate()+2);
  }

  const formatar = (data)=>{
    const dia = String(data.getDate()).padStart(2,'0');
    const mes = String(data.getMonth()+1).padStart(2,'0');
    const ano = data.getFullYear();
    const nomeDia = nomesDias[data.getDay()];
    return `${dia}/${mes}/${ano}   ${nomeDia}`;
  }

  return {
    carrego: formatar(dataCarrego),
    saida: formatar(dataSaida)
  };
}

// ?? QUANTIDADES DO DIA ATUAL
if(lojasPorDia[diaChave]){

  const dadosHoje = lojasPorDia[diaChave];

  const totalFiliais = dadosHoje.filiais ? dadosHoje.filiais.length : 0;
  const totalPostos = dadosHoje.postos ? dadosHoje.postos.length : 0;
  const totalLojas = dadosHoje.lojas ? dadosHoje.lojas.length : 0;

  document.getElementById("infoQuantidades").innerHTML = `
    <strong>CARREGOS DO DIA</strong>
    <div class="qtd-grid">
      <div class="qtd-item">
        <span>${totalFiliais}</span>
        <small>FILIAIS</small>
      </div>
      <div class="qtd-item">
        <span>${totalPostos}</span>
        <small>POSTOS</small>
      </div>
      <div class="qtd-item">
        <span>${totalLojas}</span>
        <small>LOJAS TERESINA</small>
      </div>
      <div class="qtd-item">
        <span>${totalFiliais + totalPostos + totalLojas}</span>
        <small>TOTAL</small>
      </div>
    </div>
  `;
}


// ?? DATA ATUAL (Planejamento)
const formatarCompleto = (data)=>{
  const dias = ["Domingo","Segunda","Terca","Quarta","Quinta","Sexta","Sabado"];
  const dia = String(data.getDate()).padStart(2,'0');
  const mes = String(data.getMonth()+1).padStart(2,'0');
  const ano = data.getFullYear();
  return `${dias[data.getDay()]}   ${dia}/${mes}/${ano}`;
};

document.getElementById("infoPlanejamento").innerHTML =
  `<strong>PLANEJAMENTO DE CARREGO</strong>
   <div class="painel-data">${formatarCompleto(new Date())}</div>`;


// ?? SA DA BASEADA NO DIA ATUAL
let dataSaidaBase = new Date();

if(diaChave === "quinta"){
  dataSaidaBase.setDate(dataSaidaBase.getDate()+4);
}
else if(diaChave === "sexta"){
  dataSaidaBase.setDate(dataSaidaBase.getDate()+4);
}
else{
  dataSaidaBase.setDate(dataSaidaBase.getDate()+2);
}

document.getElementById("infoSaida").innerHTML =
  `<strong>SAIDA PARA A LOJA</strong>
   <div class="painel-data">${formatarCompleto(dataSaidaBase)}</div>`;

/* PESQUISA */
const input = document.getElementById("pesquisa");
const box = document.getElementById("resultadoFlutuante");
const conteudoResultado = document.getElementById("resultadoConteudo");

input.addEventListener("input", function() {
  const busca = this.value.trim().toUpperCase();
  if (busca.length < 2) {
    box.classList.remove("ativo");
    return;
  }

  let html = "";
  let encontrado = false;

  // 1?? Verifica nas lojasPorDia (filiais, postos, lojas)
  for (const dia in lojasPorDia) {
    const grupos = lojasPorDia[dia];
    for (const grupo in grupos) {
      if (grupos[grupo].includes(busca)) {
        encontrado = true;
        const datas = calcularDatas(dia);

        html += `
          <h3>Loja <span class="destaque">${busca}</span></h3>
          <div class="info-box">
            <strong>Planeja:</strong> ${datas.carrego}<br>
            <strong class="data-saida">Data da Saida:</strong> ${datas.saida}<br>
            <strong class="label-azul">Grupo:</strong> ${grupo.toUpperCase()}<br>
            <strong class="label-amarelo">Carrego:</strong> 
            <span class="destaque">${busca}</span>
          </div>
        `;
      }
    }
  }

  // 2?? Verifica no carregos
  for (const base in carregos) {
    if (base === busca || carregos[base].includes(busca)) {
      encontrado = true;
      const lojasRelacionadas = [base, ...carregos[base]]; // mostra todas as lojas do carrego

      // Procura em qual dia o base esta programado
      for (const dia in lojasPorDia) {
        const grupos = lojasPorDia[dia];
        for (const grupo in grupos) {
          if (grupos[grupo].includes(base)) {
            const datas = calcularDatas(dia);

            html += `
              <h3>Carrego Base <span class="destaque">${base}</span></h3>
              <div class="info-box">
                <strong>Planeja:</strong> ${datas.carrego}<br>
                <strong class="data-saida">Data da Saida:</strong> ${datas.saida}<br>
                <strong class="label-azul">Grupo:</strong> ${grupo.toUpperCase()}<br>
              </div>
              <div class="info-box">
                <strong class="label-amarelo">Lojas do mesmo Carrego:</strong><br>
                ${lojasRelacionadas.map(loja => `<span class="badge">${loja}</span>`).join("")}
              </div>
            `;
          }
        }
      }
    }
  }

  // 3?? Caso n o encontre nada
  if (!encontrado) {
    html = `
      <div class="nao-encontrado">
        <div class="icone"></div>
        <div class="titulo-erro">Loja Nao Localizada</div>
        <div class="subtexto">Verifique a Sigla Digitada ou Consulte o Planejamento.</div>
      </div>
    `;
  }

  conteudoResultado.innerHTML = html;
  box.classList.add("ativo");
});


function fecharResultado(){
  box.classList.remove("ativo");
  input.value = "";
}

</script>

</body>
</html>
