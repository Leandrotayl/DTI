}

  content: "";

.copy-msg.success {

.copy-msg.error {

    0 10px 35px rgba(0,0,0,0.7),
    0 0 25px rgba(255,0,0,0.6);
}

/* Mostrar */
.copy-msg.show {
  right: 30px;
  transform: scale(1);
  opacity: 1;
}

function mostrarTabela(lista){
  telaLojas.innerHTML=''; 
  if(lista.length===0) return;

  // Agrupa lojas por filial
  const agrupadas = {};
  lista.forEach(l => {
    if(!agrupadas[l.filial]) agrupadas[l.filial] = [];
    agrupadas[l.filial].push(l);
  });

  for(const filial in agrupadas){
    const lojasFilial = agrupadas[filial];

    // Cria um card por filial
    const cardFilial = document.createElement('div');
    cardFilial.className = 'card';
    cardFilial.style.position='relative';
    cardFilial.innerHTML = `
      <h2>${filial}</h2>
      <div class="badge">${lojasFilial.length}</div>
      <div style="margin-top:15px;">
        <table style="width:100%; border-collapse: separate; border-spacing: 0 6px;">
          <thead>
            <tr>
              <th>Sigla</th><th>Tipo</th><th>IP</th><th>Cidade</th><th>Dispositivo</th><th>PDVs</th><th>Acao</th>
            </tr>
          </thead>
          <tbody>
            ${lojasFilial.map(l=>{
              const pdvs1 = l.pdvs.slice(0, Math.ceil(l.pdvs.length / 2));
              const pdvs2 = l.pdvs.slice(Math.ceil(l.pdvs.length / 2));
              return `<tr>
                <td>${l.sigla}</td>
                <td>${l.tipo}</td>
                <td>${l.ip}</td>
                <td>${l.cidade}</td>
                <td>${l.dispositivo}</td>
                <td>
                  <div style="display:flex; gap:6px; justify-content:center;">
                    <ul style="padding:0; margin:0; flex:1;">${pdvs1.map(p=>`<li style="list-style:none;background: rgba(255,204,0,0.1);margin:2px 0;padding:3px 6px;border-radius:6px;">${p}</li>`).join('')}</ul>
                    ${pdvs2.length>0 ? `<ul style="padding:0; margin:0; flex:1;">${pdvs2.map(p=>`<li style="list-style:none;background: rgba(255,204,0,0.2);margin:2px 0;padding:3px 6px;border-radius:6px;">${p}</li>`).join('')}</ul>` : ''}
                  </div>
                </td>
                <td id="acoes-${l.sigla}"></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;

    telaLojas.appendChild(cardFilial);

    // Botões de ação
    lojasFilial.forEach(l=>{
      const td=document.getElementById(`acoes-${l.sigla}`);
      const ip = l.ip;
      if(l.dispositivo.toLowerCase()==="mikrotik"){
        const btn=document.createElement('button'); 
        btn.className='action-btn'; 
        btn.style.backgroundColor='#2ecc71'; 
        btn.textContent='Copiar';
        btn.onclick=()=>copiarDireto(`${ip}:5819`);
        td.appendChild(btn);
      }
      if(l.dispositivo.toLowerCase()==="fortigate"){
        const openBtn=document.createElement('button'); 
        openBtn.className='action-btn'; 
        openBtn.style.backgroundColor='#3498db'; 
        openBtn.textContent='Abrir';
        openBtn.onclick=()=>window.open(`https://${ip}:5413`,'_blank'); 
        td.appendChild(openBtn);

        const senha = l.senha || 'Hrt5M-jgExN7';
        const senhaBtn=document.createElement('button'); 
        senhaBtn.className='action-btn'; 
        senhaBtn.style.backgroundColor='#e67e22'; 
        senhaBtn.textContent='Copiar Senha';
        senhaBtn.onclick = () => abrirModal(senha);
        td.appendChild(senhaBtn);
      }
    });
  }
}

let resultadoAtual = [];

function aplicarFiltros() {

  const termoBusca = document.getElementById('searchInput').value.toLowerCase();
  const tipoSelecionado = document.getElementById('filtroTipo').value;
  const dispositivoSelecionado = document.getElementById('filtroDispositivo').value;

  resultadoAtual = lojas.filter(loja => {

    const correspondeBusca =
      loja.sigla.toLowerCase().includes(termoBusca) ||
      loja.ip.toLowerCase().includes(termoBusca);

    const correspondeTipo =
      tipoSelecionado === 'todos' ||
      loja.tipo === tipoSelecionado;

    const correspondeDispositivo =
      dispositivoSelecionado === 'todos' ||
      loja.dispositivo === dispositivoSelecionado;

    return correspondeBusca && correspondeTipo && correspondeDispositivo;
  });

  if (resultadoAtual.length === 0) {
    telaLojas.innerHTML = "<p style='margin-top:30px;'>Nenhum Resultado Encontrado.</p>";
  } else {
    mostrarTabela(resultadoAtual);
  }

  telaRegionais.style.display = 'none';
  backBtn.style.display = 'inline-block';

  atualizarResumo(resultadoAtual);

  document.getElementById('btnDownload').style.display =
    resultadoAtual.length > 0 ? 'inline-block' : 'none';
}

const btnMenu = document.getElementById("btnMenu");
btnMenu.addEventListener("click", () => {

function baixarResultado() {
  if (resultadoAtual.length === 0) return;

  let csv = "Sigla,Filial,Tipo,IP,Dispositivo\n";

  resultadoAtual.forEach(loja => {
    csv += `${loja.sigla},${loja.filial},${loja.tipo},${loja.ip},${loja.dispositivo}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = "resultado_filtro_claudino.csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function baixarExcel() {
  if (resultadoAtual.length === 0) return;

  // Cria uma planilha XLSX
  const ws_data = [
    ["Sigla","Filial","Tipo","IP","Dispositivo","Cidade","PDVs"]
  ];

  resultadoAtual.forEach(loja => {
    ws_data.push([
      loja.sigla,
      loja.filial,
      loja.tipo,
      loja.ip,
      loja.dispositivo,
      loja.cidade,
      loja.pdvs.join(", ")
    ]);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(ws_data);
  XLSX.utils.book_append_sheet(wb, ws, "Resultado");
  XLSX.writeFile(wb, "resultado_filtro_claudino.xlsx");
}


function destacarLoja(sigla) {
  document.querySelectorAll('.card-loja-pesquisada').forEach(card=>{

function abrirModal(texto){
  textoParaCopiar = texto;
  authInput.value = '';
  errorMsg.textContent = '';
  modal.style.display = 'flex';
  authInput.focus();
}


authInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); validarSenha(); }
});

function copiarDireto(texto){
  const temp = document.createElement('textarea');
  temp.value = texto;
  document.body.appendChild(temp);
  temp.select();
  temp.setSelectionRange(0,99999);
  document.execCommand('copy');
  document.body.removeChild(temp);

  // MOSTRA APENAS SUCESSO
  copyMsg.className = "copy-msg success show";
  copyMsg.textContent = " COPIADO COM SUCESSO";

  setTimeout(() => {
    copyMsg.classList.remove("show");
  }, 3000);
}




function validarSenha(){

  if(authInput.value.trim() === LIBERACAO_SENHA){

    if(!textoParaCopiar){
      return;
    }

    const temp = document.createElement('textarea');
    temp.value = textoParaCopiar;
    document.body.appendChild(temp);
    temp.select();
    temp.setSelectionRange(0, 99999);
    document.execCommand('copy');
    document.body.removeChild(temp);

    modal.style.display = 'none';

    // SUCESSO
    copyMsg.className = "copy-msg success show";
    copyMsg.textContent = " ACESSO LIBERADO E COPIADO";

    setTimeout(() => {
      copyMsg.classList.remove("show");
    }, 3000);

  } else {

    // ERRO no mesmo estilo visual
    copyMsg.className = "copy-msg error show";
    copyMsg.textContent = " SENHA INCORRETA - DIGITE NOVAMENTE";

    setTimeout(() => {
      copyMsg.classList.remove("show");
    }, 3000);

    authInput.focus();
  }

  authInput.value = '';
}
